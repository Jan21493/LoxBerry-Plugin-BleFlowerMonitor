INTRO="Nastavení: nastavte a uložte obecné volby a interval načítání, Bluetooth adaptér se seznamem nainstalovaných adaptérů a přenos do Miniserveru přes MQTT/UDP. Stav a načítání: Načíst nyní spustí vyhledávání s živým průběhem a podrobnostmi o vybraném adaptéru včetně všech nalezených senzorů. Níže najdete příklady virtuálních vstupů Loxone s pokyny pro použití a nastavení MQTT i UDP. Protokoly: aktuální protokoly komunikace se senzory MiFlora s nastavitelnou úrovní protokolování."

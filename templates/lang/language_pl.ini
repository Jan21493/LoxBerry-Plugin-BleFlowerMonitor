sectionLoxone="Wejścia wirtualne w Loxone Config"
hintLoxone="Przykłady używają zapisanego tematu MQTT i wybranego adresu MAC. Wybierz jeden z wykrytych czujników lub użyj <b>'Edytuj'</b>, aby wpisać inny adres MAC. Jeśli nie wykryto czujnika, wyświetlany jest adres przykładowy. Ten wybór zmienia tylko instrukcję konfiguracji, nie skonfigurowane metody przesyłania."

hintLogs="Każdy ręczny lub zaplanowany odczyt tworzy sesję dziennika LoxBerry w grupie <b>'FlowerCare'</b> na wybranym poziomie. <b>'Debug'</b> zawiera najwięcej szczegółów; pozostałe poziomy odpowiednio mniej. Pliki są przechowywane w katalogu dzienników wtyczki na dysku RAM i kończą się na _xiaomi-miflora.log. LoxBerry zarządza usuwaniem starych dzienników. Dzienniki na dysku RAM mogą zniknąć po ponownym uruchomieniu."

tplHint="Tworzy szablon wirtualnego wejścia HTTP z jednym wirtualnym poleceniem wejścia HTTP na czujnik i wartość. Tytuł każdego polecenia dokładnie odpowiada nazwie wirtualnego wejścia, opis składa się z nazwy czujnika i oznaczenia parametru. Zaimportuj plik w Loxone Config poprzez Importuj szablon."

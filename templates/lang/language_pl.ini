hintTextInputs="<b>Wartości tekstowe:</b> Dla Name, Firmware i PollTimeString utwórz <b><i>'wirtualne wejście tekstowe'</i></b> o pasującej nazwie zamiast <b><i>'polecenia wirtualnego wejścia HTTP'</i></b>. Tylko MQTT Gateway może przesyłać tekst do Miniservera przez API."
hintUDPText="Rozpoznawanie polecenia UDP =\v dotyczy tylko liczb. Wartości tekstowe (Name, Firmware, PollTimeString) nie są obsługiwane."
gatewayV2Active="Wybrano MQTT Gateway w wersji 2, świetnie!"
gatewayV2Recommended="MQTT Gateway w wersji 2 nie jest wybrana, ale jest zalecana w LoxBerry 4 ze względu na wydajność."
hintGatewayV2="<b>Ważne:</b> MQTT Gateway w wersji 2 nie subskrybuje automatycznie wszystkich tematów. Wybierz konkretne tematy, które chcesz przesyłać do Miniservera. Poniżej znajduje się krótka instrukcja przesyłania przez HTTP/API:"
gatewayStep1="Otwórz menu <b><i>'MQTT Gateway'</i></b>, kartę <b><i>'Subskrypcje'</i></b>. W razie potrzeby rozwiń foldery, zaznacz żądane tematy pojedynczo i przypisz je do Miniservera. W nowszych wersjach LoxBerry możesz również przeskanować Miniserver w poszukiwaniu skonfigurowanych tematów, jeśli zostały już tam utworzone. <b>Ważne:</b> Nie subskrybuj całego folderu, chyba że naprawdę potrzebujesz wszystkich jego tematów."
gatewayStep2="Otwórz kartę <b><i>'Ruch'</i></b>. Tematy są wyświetlane z nazwami wejść wirtualnych i można je bezpośrednio kopiować. Pasujące nazwy możesz też skopiować z poniższej tabeli. Używaj nazw dokładnie w pokazanej postaci!"
gatewayStep3="W Loxone Config utwórz <b><i>'wirtualne wejście HTTP'</i></b> jako folder dla subskrybowanych tematów. W polu <b><i>'URL'</i></b> wpisz pojedynczą kropkę (<code>.</code>), aby uniknąć ostrzeżeń o brakujących parametrach."
gatewayStep4="Dla każdej wartości liczbowej utwórz <b><i>'polecenie wirtualnego wejścia HTTP'</i></b> i wklej pasującą nazwę wejścia w polu <b><i>'Nazwa'</i></b>. <b>Ważne:</b> Zachowaj dokładną wielkość liter. W polu <b><i>'rozpoznawanie polecenia'</i></b> wpisz <code>\.</code>, aby spełnić wymaganie pola obowiązkowego. <b>Odpytywanie HTTP NIE jest używane!</b> MQTT Gateway wysyła wartości do Miniservera przez wywołania API. Dla wartości tekstowych użyj <b><i>'wirtualnych wejść tekstowych'</i></b>."
gatewayStep5="Prześlij zaktualizowaną konfigurację Loxone Config do Miniservera."
gatewayChangedValues="<b>Uwaga:</b> MQTT Gateway przekazuje tylko zmienione wartości. Po utworzeniu wejść poczekaj na zmianę wartości lub naciśnij <b><i>'Wyślij wszystko ponownie'</i></b> w menu <b><i>'MQTT Gateway'</i></b>, na karcie <b><i>'Ruch'</i></b>."
errLogList="Nie udało się załadować standardowego widoku dzienników LoxBerry. Sprawdź LoxBerry Log Manager i dziennik systemowy."
gatewayAvailable="Znaleziono konfigurację MQTT; przesyłanie używa ustawień z <b>'MQTT Basics'</b> w LoxBerry."
gatewayUnavailable="Nie znaleziono konfiguracji brokera MQTT. Sprawdź wszystkie ustawienia LoxBerry w menu <b>'MQTT Gateway'</b>, szczególnie <b>'MQTT Basics'</b>."
errGatewayConfig="Nie udało się odczytać wersji MQTT Gateway z pliku general.json LoxBerry. Sprawdź konfigurację systemową i dziennik wtyczki."
hintSensorInfo="Standardowy odczyt zwraca te dziewięć wartości. Adres MAC i RSSI (siła odbieranego sygnału w dBm) pojawiają się jako diagnostyka w dzienniku na żywo; odległość w metrach jest tylko przybliżonym oszacowaniem w wolnej przestrzeni, a nie pomiarem czujnika. RSSI nie jest publikowane jako pomiar. Brak osobnej wartości pH, wilgotności powietrza lub nazwy rośliny. Światło jest podawane jako natężenie oświetlenia w luksach (lx), nie jako strumień świetlny w lumenach."

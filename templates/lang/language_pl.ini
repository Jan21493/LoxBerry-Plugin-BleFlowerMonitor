sensorMac="Adres MAC czujnika"
errMAC="Wpisz adres MAC zawierający 12 znaków szesnastkowych, opcjonalnie rozdzielonych dwukropkami."
hintLoxoneMQTT="Otwórz <b><i>'MQTT Gateway'</i></b> w <b><i>'MQTT Basics'</i></b> w LoxBerry, dodaj poniższą subskrypcję i przypisz żądane tematy do Miniservera. Dla przesyłania HTTP z bramy utwórz w Loxone Config wejścia wirtualne o podanych nazwach. <b>Ważne:</b> Wtyczka publikuje tematy wyłącznie małymi literami; brama zastępuje /, spacje i % w nazwach wejść znakiem _. Samo MQTT nie tworzy wejść w Loxone Config."
subscription="Subskrypcja MQTT Gateway"
hintGatewayUDP="Jeśli MQTT Gateway wysyła do Miniservera przez UDP zamiast HTTP, obowiązuje port UDP i format poleceń bramy. Pokazane tutaj nazwy wejść wirtualnych dotyczą HTTP. Opcja UDP poniżej opisuje bezpośrednie wyjście UDP tej wtyczki, a nie bramy."
hintLoxoneUDP="Włącz UDP we wtyczce i zapisz ustawienia. W Loxone Config utwórz <b><i>'wirtualne wejście UDP'</i></b> na skonfigurowanym porcie, a pod nim <b><i>'polecenie wirtualnego wejścia UDP'</i></b> dla każdego pomiaru. Skopiuj <b><i>'rozpoznawanie polecenia'</i></b> z tabeli. <b>Ważne:</b> Adresy MAC muszą być zapisane wielkimi literami bez dwukropków, nazwy parametrów muszą zachować dokładną wielkość liter, a dla wartości liczbowych należy podać <code>=\v</code>."

heading="BLE Flower Monitor"
pluginIntro="Wtyczka BLE Flower Monitor odczytuje przez Bluetooth Low Energy (BLE) kompatybilne czujniki roślin, takie jak <b>Xiaomi Mi Flora</b> (znany również jako <b>HHCC Flower Care</b>, <b>VegTrug Flora Sensor</b> lub <b>Wanfei plant monitor</b>), oraz pokrewne modele HHCC Flower Care Max i HHCC Touch. Wszystkie te czujniki używają tego samego protokołu. Wtyczka jest niezależnie opracowanym następcą wycofanej <b>wtyczki Xiaomi Mi Flora Flower Monitor</b> Michaela Miklisa i zachowuje część jej ustawień oraz interfejsu. Nowoczesny interfejs BlueZ D-Bus umożliwia używanie jej w wielu systemach Linux; obsługiwane są wbudowane adaptery Raspberry Pi i adaptery Bluetooth USB."
sectionGeneral="Ogólne i interwał odczytu"
sectionBluetooth="Bluetooth / BlueZ D-Bus"
sectionMiniserver="Wysyłanie do Miniservera"
sectionMQTT="MQTT (zalecane)"
sectionUDP="UDP (alternatywa)"
sectionDiagnostics="Odczyt i diagnostyka"
hintGeneral="Po włączeniu wtyczka wyszukuje kompatybilne czujniki roślin przez Bluetooth Low Energy (BLE) z wybranym interwałem godzinowym i odczytuje je kolejno."
hintLocaltime="Wewnętrzny czas Miniservera liczy sekundy od 01.01.2009 00:00:00 w jego lokalnej strefie czasowej. Ten przełącznik uwzględnia lokalną strefę czasową LoxBerry w znaczniku czasu Loxone (parametr <b>'PollTime'</b>). W przeciwnym razie używany jest UTC. <b>'PollTimeString'</b> podaje czas w czytelnym formacie."
hintBluetooth="Ustawienia adaptera Bluetooth do komunikacji z czujnikami. Wtyczka wykrywa czujniki podczas skanowania BLE, a następnie odczytuje pomiary przez GATT. W systemie Linux biblioteka Python Bleak korzysta z interfejsu BlueZ D-Bus: BlueZ zapewnia usługę Bluetooth, a D-Bus umożliwia programom komunikację z nią. Wymagany jest adapter obsługujący BLE (Bluetooth 4.0 lub nowszy; BLE 5 nie jest konieczne), BlueZ 5.55 lub nowszy oraz włączony i niezablokowany adapter."
lblBTAdapter="Adapter Bluetooth"
hintBTAdapter="Default zawsze używa hci0. USB i Onboard wybierają przy każdym odczycie pierwszy pasujący adapter danego typu. Jeśli nie ma pasującego adaptera, zgłaszany jest błąd; wtyczka nie przełącza się automatycznie na inny typ."
lblDetectedAdapters="Zainstalowane adaptery Bluetooth"
adapterSerial="Wbudowany"
adapterUSB="USB"
adapterMissing="Nie wykryto pasującego adaptera Bluetooth"
hintMQTT="Jest to zalecana metoda przesyłania, ponieważ nie wymaga odpytywania z Miniservera. MQTT Gateway przesyła dane przez wywołania API (HTTP Web API). Wszystkie ustawienia MQTT są pobierane z <b>'MQTT Basics'</b> w LoxBerry."
hintMQTTTopic="Format i wymagane wejścia wirtualne opisano w sekcji <b>'Status i odczyty'</b>. Format to /<prefiks MQTT>/<adres MAC>/<parametr>, np. /flowermon/c47c8d66275b/temperature. Przy migracji ze starej wtyczki użyj tematu <b>'miflora'</b>, aby zachować istniejące tematy MQTT. Temat, adres MAC i nazwa czujnika są zapisywane małymi literami. Nie używaj znaków specjalnych (+ lub #), ponieważ mają szczególne znaczenie w protokole MQTT."
hintUDP="Ta alternatywna metoda jest przeznaczona głównie do migracji istniejących instalacji. Dane są wysyłane bezpośrednio do Miniservera i muszą być tam przetwarzane przez wejścia UDP. Używanie UDP równocześnie z MQTT NIE jest zalecane. Miniserver i port UDP są wymagane tylko przy włączonym przesyłaniu UDP. Format pozostaje bez zmian: C47C8D66275B.Temperature=27.1"
hintDiagnostics="Użyj <b>'Odczytaj teraz'</b>, aby uruchomić ręczny odczyt i wykryć czujniki MiFlora wraz z adresami MAC i bieżącymi pomiarami. Poniżej pokazano wejścia wirtualne potrzebne do przesyłania i przetwarzania wartości tych czujników w Miniserverze. Musisz jeszcze utworzyć te wejścia w Miniserverze. Odczyt jest wykonywany raz z zapisanymi ustawieniami. Postęp jest odświeżany co sekundę. Szczegóły każdego odczytu znajdziesz w dziennikach."

INTRO="Einstellungen: Zeitplan, Bluetooth-Adapter mit Liste der installierten Adapter und MQTT/UDP konfigurieren und speichern. Status und Abfragen: Jetzt abfragen startet einen Scan mit Live-Fortschritt und Details zum ausgewählten Adapter; Auto-Scroll und Download stehen neben Aktualisieren. Darunter finden Sie Beispiele für virtuelle Loxone-Eingänge mit Anleitung für die aktive MQTT-Gateway-Version. Logs: je Abfrage eine native LoxBerry-Logsession in der Gruppe FlowerCare mit LOGSTART/LOGEND, Standard-Loganzeige und einstellbarem Log-Level. MQTT verwendet immer LoxBerrys MQTT Basics."

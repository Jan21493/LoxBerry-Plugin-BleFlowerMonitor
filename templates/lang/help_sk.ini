INTRO="Nastavenia: nastavte a uložte všeobecné voľby a interval načítania, Bluetooth adaptér so zoznamom nainštalovaných adaptérov a prenos do Miniservera cez MQTT/UDP. Stav a načítania: Načítať teraz spustí vyhľadávanie so živým priebehom a podrobnosťami o vybranom adaptéri vrátane všetkých nájdených senzorov. Nižšie nájdete príklady virtuálnych vstupov Loxone s pokynmi na použitie a nastavenie MQTT aj UDP. Protokoly: aktuálne protokoly komunikácie so senzormi MiFlora s nastaviteľnou úrovňou protokolovania."

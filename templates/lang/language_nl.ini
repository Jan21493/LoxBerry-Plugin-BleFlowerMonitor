hintLogs="Elke handmatige of geplande uitlezing maakt een LoxBerry-logsessie in de groep <b>'FlowerCare'</b> op het gekozen niveau. <b>'Debug'</b> bevat de meeste details; de andere niveaus bevatten overeenkomstig minder informatie. Bestanden staan in de logmap van de plugin op een RAM-schijf en eindigen op _xiaomi-miflora.log. LoxBerry beheert het verwijderen van oude logs. Logs op de RAM-schijf kunnen na een herstart ontbreken."

sectionLoxone="Virtuele ingangen in Loxone Config"
hintLoxone="Voorbeelden gebruiken het opgeslagen MQTT-topic en het geselecteerde MAC-adres. Selecteer een gevonden sensor of gebruik <b>'Bewerken'</b> om een ander MAC-adres in te voeren. Als geen sensor is gevonden, verschijnt een voorbeeldadres. Deze keuze wijzigt alleen de installatiehulp, niet de ingestelde overdrachtsmethoden."
transport="Overdrachtsmethode"
mqttRecommended="MQTT (aanbevolen)"
sensorMac="MAC-adres van sensor"
errMAC="Voer een MAC-adres met 12 hexadecimale tekens in, eventueel gescheiden door dubbele punten."
hintLoxoneMQTT="Open <b><i>'MQTT Gateway'</i></b> in <b><i>'MQTT Basics'</i></b> van LoxBerry, voeg het onderstaande abonnement toe en wijs de gewenste topics toe aan de Miniserver. Maak voor HTTP-overdracht vanuit de gateway virtuele ingangen in Loxone Config met de getoonde namen. <b>Belangrijk:</b> De plugin publiceert topics volledig in kleine letters; de gateway vervangt /, spaties en % in ingangsnamen door _. MQTT alleen maakt geen ingangen in Loxone Config aan."
subscription="MQTT Gateway-abonnement"
hintGatewayUDP="Als MQTT Gateway via UDP in plaats van HTTP naar de Miniserver stuurt, gelden de UDP-poort en het opdrachtformaat van de gateway. De hier getoonde virtuele ingangsnamen gelden voor HTTP. De UDP-keuze hieronder beschrijft de directe UDP-uitvoer van deze plugin, niet die van de gateway."
hintLoxoneUDP="Schakel UDP in de plugin in en sla op. Maak in Loxone Config een <b><i>'virtuele UDP-ingang'</i></b> op de ingestelde poort en daaronder een <b><i>'virtuele UDP-ingangsopdracht'</i></b> per meetwaarde. Kopieer de <b><i>'opdrachtherkenning'</i></b> uit de tabel. <b>Belangrijk:</b> MAC-adressen moeten in hoofdletters zonder dubbele punten staan, parameternamen moeten exact dezelfde hoofdletters en kleine letters gebruiken en <code>=\v</code> moet worden opgegeven voor numerieke waarden."

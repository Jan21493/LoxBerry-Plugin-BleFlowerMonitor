valueConductivity="Elektrische geleidbaarheid van de bodem als indicatie van het voedingsstoffengehalte"
valueBattery="Batterijniveau (0–100 %)"
hintTextInputs="<b>Tekstwaarden:</b> Maak voor Name, Firmware en PollTimeString een <b><i>'virtuele tekstingang'</i></b> met de bijbehorende naam in plaats van een <b><i>'virtuele HTTP-ingangsopdracht'</i></b>. Alleen MQTT Gateway kan tekst via de API naar de Miniserver overdragen."
hintUDPText="UDP-opdrachtherkenning =\v geldt alleen voor getallen. Tekstwaarden (Name, Firmware, PollTimeString) worden niet ondersteund."
gatewayV2Active="MQTT Gateway versie 2 is geselecteerd, prima!"
gatewayV2Recommended="MQTT Gateway versie 2 is niet geselecteerd, maar wordt op LoxBerry 4 aanbevolen vanwege de efficiëntie."
hintGatewayV2="<b>Belangrijk:</b> MQTT Gateway versie 2 abonneert zich niet automatisch op alle topics. Selecteer de specifieke topics die je naar de Miniserver wilt doorsturen. Hier volgt een korte handleiding voor HTTP/API-overdracht:"
gatewayStep1="Open het menu <b><i>'MQTT Gateway'</i></b>, tabblad <b><i>'Abonnementen'</i></b>. Vouw zo nodig mappen uit, vink de gewenste topics afzonderlijk aan en wijs ze toe aan de Miniserver. In nieuwere LoxBerry-versies kun je de Miniserver ook scannen op geconfigureerde topics als deze daar al zijn aangemaakt. <b>Belangrijk:</b> Abonneer je niet op een hele map, tenzij je echt alle onderliggende topics nodig hebt."
gatewayStep2="Open het tabblad <b><i>'Verkeer'</i></b>. Topics worden met de virtuele ingangsnamen weergegeven en kunnen rechtstreeks worden gekopieerd. Je kunt de bijbehorende namen ook uit de onderstaande tabel kopiëren. Neem de namen exact over!"
gatewayStep3="Maak in Loxone Config een <b><i>'virtuele HTTP-ingang'</i></b> als map voor de geabonneerde topics. Voer bij <b><i>'URL'</i></b> één punt (<code>.</code>) in om waarschuwingen over ontbrekende parameters te voorkomen."
gatewayStep4="Maak voor elke numerieke waarde een <b><i>'virtuele HTTP-ingangsopdracht'</i></b> en plak de bijbehorende ingangsnaam in <b><i>'Naam'</i></b>. <b>Belangrijk:</b> Gebruik exact dezelfde hoofdletters en kleine letters. Voer bij <b><i>'opdrachtherkenning'</i></b> <code>\.</code> in om aan de controle op verplichte velden te voldoen. <b>HTTP-polling wordt NIET gebruikt!</b> MQTT Gateway stuurt waarden via API-aanroepen naar de Miniserver. Gebruik voor tekstwaarden <b><i>'virtuele tekstingangen'</i></b>."
gatewayStep5="Zet de bijgewerkte Loxone Config over naar de Miniserver."
gatewayChangedValues="<b>Opmerking:</b> MQTT Gateway stuurt alleen gewijzigde waarden door. Wacht na het aanmaken van ingangen op een wijziging of druk op <b><i>'Alles opnieuw verzenden'</i></b> in het menu <b><i>'MQTT Gateway'</i></b>, tabblad <b><i>'Verkeer'</i></b>."
errLogList="De standaard logweergave van LoxBerry kon niet worden geladen. Controleer LoxBerry Log Manager en het systeemlog."
gatewayAvailable="MQTT-configuratie gevonden; de overdracht gebruikt de instellingen onder <b>'MQTT Basics'</b> in LoxBerry."
gatewayUnavailable="Geen MQTT-brokerconfiguratie gevonden. Controleer alle LoxBerry-instellingen in het menu <b>'MQTT Gateway'</b>, vooral <b>'MQTT Basics'</b>."
errGatewayConfig="De MQTT Gateway-versie kon niet uit general.json van LoxBerry worden gelezen. Controleer de systeemconfiguratie en het pluginlog."
hintSensorInfo="De standaarduitlezing levert deze negen waarden. MAC-adres en RSSI (ontvangen signaalsterkte in dBm) verschijnen als diagnose in het livelog; de afstand in meters is slechts een ruwe schatting in het vrije veld, geen sensormeting. RSSI wordt niet als meetwaarde gepubliceerd. Er is geen afzonderlijke waarde voor pH, luchtvochtigheid of plantnaam. Licht wordt als verlichtingssterkte in lux (lx) weergegeven, niet als lichtstroom in lumen."

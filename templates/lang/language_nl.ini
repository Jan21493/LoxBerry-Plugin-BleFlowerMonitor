heading="BLE Flower Monitor"
pluginIntro="De BLE Flower Monitor-plugin leest compatibele plantsensoren zoals de <b>Xiaomi Mi Flora</b> (ook bekend als <b>HHCC Flower Care</b>, <b>VegTrug Flora Sensor</b> of <b>Wanfei plant monitor</b>) en verwante modellen zoals de HHCC Flower Care Max en HHCC Touch uit via Bluetooth Low Energy (BLE). Al deze sensoren gebruiken hetzelfde protocol. De plugin is een onafhankelijk ontwikkelde opvolger van de stopgezette <b>Xiaomi Mi Flora Flower Monitor-plugin</b> van Michael Miklis en behoudt delen van de instellingen en weergave. De moderne BlueZ D-Bus-interface maakt gebruik op veel Linux-systemen mogelijk; ingebouwde Raspberry Pi-adapters en USB-Bluetooth-adapters worden ondersteund."
sectionGeneral="Algemeen en uitleesinterval"
sectionBluetooth="Bluetooth / BlueZ D-Bus"
sectionMiniserver="Verzenden naar Miniserver"
sectionMQTT="MQTT (aanbevolen)"
sectionUDP="UDP (alternatief)"
sectionDiagnostics="Uitlezen en diagnose"
hintGeneral="Wanneer de plugin is ingeschakeld, zoekt deze met het gekozen uurinterval via Bluetooth Low Energy (BLE) naar compatibele plantsensoren en leest deze achtereenvolgens uit."
hintLocaltime="De interne tijd van de Miniserver telt seconden vanaf 01-01-2009 00:00:00 in zijn lokale tijdzone. Deze schakelaar past de lokale tijdzone van LoxBerry toe op de Loxone-tijdstempel (parameter <b>'PollTime'</b>). Anders wordt UTC gebruikt. <b>'PollTimeString'</b> geeft de tijd in een leesbaar formaat."
hintBluetooth="Instellingen voor de Bluetooth-adapter voor communicatie met de sensoren. De plugin vindt sensoren tijdens een BLE-scan en leest daarna meetwaarden via GATT. Onder Linux gebruikt de Python-bibliotheek Bleak de BlueZ D-Bus-interface: BlueZ levert de Bluetooth-dienst en D-Bus laat programma's ermee communiceren. Een BLE-geschikte adapter (Bluetooth 4.0 of nieuwer; BLE 5 is niet nodig), BlueZ 5.55 of nieuwer en een ingeschakelde, niet-geblokkeerde adapter zijn vereist."
lblBTAdapter="Bluetooth-adapter"
hintBTAdapter="Default gebruikt altijd hci0. USB en Onboard kiezen bij elke uitlezing de eerste passende adapter van dat type. Als er geen passende adapter beschikbaar is, wordt een fout gemeld; de plugin schakelt niet automatisch over op een ander type."
lblDetectedAdapters="Geïnstalleerde Bluetooth-adapters"
adapterSerial="Ingebouwd"
adapterUSB="USB"
adapterMissing="Geen passende Bluetooth-adapter gevonden"
hintMQTT="Dit is de aanbevolen overdrachtsmethode omdat de Miniserver niet zelf hoeft te pollen. MQTT Gateway draagt de gegevens over via API-aanroepen (HTTP Web API). Alle MQTT-instellingen worden overgenomen uit <b>'MQTT Basics'</b> van LoxBerry."
hintMQTTTopic="Zie <b>'Status en uitlezingen'</b> voor het formaat en de benodigde virtuele ingangen. Het formaat is /<MQTT-prefix>/<MAC-adres>/<parameter>, bijvoorbeeld /flowermon/c47c8d66275b/temperature. Gebruik <b>'miflora'</b> als topic bij migratie vanaf de oude plugin om bestaande MQTT-topics te behouden. Topic, MAC-adres en sensornaam worden in kleine letters geschreven. Gebruik geen speciale tekens (+ of #), omdat deze een specifieke betekenis hebben in het MQTT-protocol."
hintUDP="Deze alternatieve overdrachtsmethode is vooral bedoeld voor migratie van bestaande installaties. Gegevens worden rechtstreeks naar de Miniserver gestuurd en moeten daar met UDP-ingangen worden verwerkt. UDP naast MQTT gebruiken wordt NIET aanbevolen. Een Miniserver en UDP-poort zijn alleen vereist als UDP-overdracht is ingeschakeld. Het formaat blijft behouden: C47C8D66275B.Temperature=27.1"
hintDiagnostics="Gebruik <b>'Nu uitlezen'</b> om handmatig een uitlezing te starten en je MiFlora-sensoren te vinden, inclusief MAC-adressen en actuele meetwaarden. Hieronder staan de virtuele ingangen die nodig zijn om de sensorwaarden naar de Miniserver over te dragen en te verwerken. Je moet deze ingangen nog op de Miniserver aanmaken. De uitlezing wordt eenmaal uitgevoerd met de opgeslagen instellingen. De voortgang wordt elke seconde bijgewerkt. Zie de logs voor details van elke uitlezing."
msgSaved="Instellingen opgeslagen."
errInvalidInput="Ongeldige instellingen. Controleer de invoer en keuzes."
errOutputRequired="Fout: Je moet minstens één overdrachtsmethode inschakelen: MQTT (aanbevolen) of UDP."
errMQTT="MQTT vereist een topic zonder jokertekens. Configureer de broker in <b>'MQTT Basics'</b> van LoxBerry."
errPort="De poort moet een geheel getal tussen 1 en 65535 zijn."
errMiniserver="UDP vereist een in LoxBerry geconfigureerde Miniserver."
errSave="De instellingen konden niet worden opgeslagen."
errAdapterInventory="De Bluetooth-adapters konden niet worden opgevraagd. Controleer de systeemrechten en het pluginlog."
errAdapterMigration="De eerdere hci-keuze wordt vervangen door een adaptertype. Controleer USB of Onboard en sla de instellingen op."
errPoll="De uitlezing kon niet worden gestart."

sensorMac="MAC adresa senzoru"
errMAC="Zadejte MAC adresu s 12 šestnáctkovými znaky, případně oddělenými dvojtečkami."
hintLoxoneMQTT="Otevřete <b><i>'MQTT Gateway'</i></b> v <b><i>'MQTT Basics'</i></b> v LoxBerry, přidejte níže uvedený odběr a přiřaďte požadovaná témata Miniserveru. Pro přenos HTTP z gateway vytvořte v Loxone Config virtuální vstupy s uvedenými názvy. <b>Důležité:</b> Plugin publikuje témata pouze malými písmeny; gateway nahrazuje /, mezery a % v názvech vstupů znakem _. Samotné MQTT nevytváří vstupy v Loxone Config."
subscription="Odběr MQTT Gateway"
hintGatewayUDP="Pokud MQTT Gateway odesílá do Miniserveru přes UDP místo HTTP, použijte její UDP port a formát příkazu. Zde uvedené názvy virtuálních vstupů se vztahují k HTTP. Volba UDP níže popisuje přímý UDP výstup tohoto pluginu, nikoli gateway."
hintLoxoneUDP="Povolte UDP v pluginu a uložte nastavení. V Loxone Config vytvořte <b><i>'virtuální UDP vstup'</i></b> na nastaveném portu a pod ním <b><i>'příkaz virtuálního UDP vstupu'</i></b> pro každou hodnotu. Z tabulky zkopírujte <b><i>'rozpoznávání příkazu'</i></b>. <b>Důležité:</b> MAC adresy musí být velkými písmeny bez dvojteček, názvy parametrů musí přesně dodržovat velikost písmen a pro číselné hodnoty musí být uvedeno <code>=\v</code>."

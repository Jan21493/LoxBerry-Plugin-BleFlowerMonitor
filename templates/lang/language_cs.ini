hintLogs="Každé ruční nebo plánované načítání vytvoří relaci protokolu LoxBerry ve skupině <b>'FlowerCare'</b> se zvolenou úrovní. <b>'Debug'</b> obsahuje nejvíce podrobností; ostatní úrovně odpovídajícím způsobem méně. Soubory jsou uloženy v adresáři protokolů pluginu na RAM disku a končí na _xiaomi-miflora.log. Mazání starých protokolů spravuje LoxBerry. Po restartu mohou protokoly na RAM disku chybět."

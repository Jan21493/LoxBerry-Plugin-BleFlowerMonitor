heading="BLE Flower Monitor"
pluginIntro="Plugin BLE Flower Monitor načítá přes Bluetooth Low Energy (BLE) kompatibilní senzory pro rostliny, například <b>Xiaomi Mi Flora</b> (známé také jako <b>HHCC Flower Care</b>, <b>VegTrug Flora Sensor</b> nebo <b>Wanfei plant monitor</b>), a příbuzné modely HHCC Flower Care Max a HHCC Touch. Všechny tyto senzory používají stejný protokol. Plugin je nezávisle vyvinutým nástupcem již nevyvíjeného <b>pluginu Xiaomi Mi Flora Flower Monitor</b> od Michaela Miklise a zachovává části jeho nastavení a zobrazení. Moderní rozhraní BlueZ D-Bus umožňuje použití na mnoha systémech Linux; podporovány jsou integrované adaptéry Raspberry Pi i USB Bluetooth adaptéry."
sectionGeneral="Obecné nastavení a interval načítání"
sectionBluetooth="Bluetooth / BlueZ D-Bus"
sectionMiniserver="Odesílání do Miniserveru"
sectionMQTT="MQTT (doporučeno)"
sectionUDP="UDP (alternativa)"
sectionDiagnostics="Načítání a diagnostika"
hintGeneral="Pokud je plugin povolen, vyhledává v nastaveném hodinovém intervalu kompatibilní senzory pro rostliny přes Bluetooth Low Energy (BLE) a postupně je načítá."
hintLocaltime="Interní čas Miniserveru počítá sekundy od 1. 1. 2009 00:00:00 v jeho místním časovém pásmu. Tento přepínač zohledňuje místní časové pásmo LoxBerry v časovém razítku Loxone (parametr <b>'PollTime'</b>). Jinak se používá UTC. <b>'PollTimeString'</b> poskytuje čas v čitelném formátu."
hintBluetooth="Nastavení Bluetooth adaptéru pro komunikaci se senzory. Plugin vyhledá senzory při BLE skenování a následně načte hodnoty přes GATT. V Linuxu knihovna Python Bleak přistupuje k Bluetooth přes rozhraní BlueZ D-Bus: BlueZ zajišťuje službu Bluetooth a D-Bus umožňuje programům s ní komunikovat. Je vyžadován adaptér s podporou BLE (Bluetooth 4.0 nebo novější; BLE 5 není nutné), BlueZ 5.55 nebo novější a zapnutý, neblokovaný adaptér."
lblBTAdapter="Bluetooth adaptér"
hintBTAdapter="Default vždy používá hci0. USB a Onboard při každém načítání vyberou první odpovídající adaptér daného typu. Pokud odpovídající adaptér není dostupný, zobrazí se chyba; plugin automaticky nepřejde na jiný typ."
lblDetectedAdapters="Nainstalované Bluetooth adaptéry"
adapterSerial="Integrovaný"
adapterUSB="USB"
adapterMissing="Nebyl nalezen odpovídající Bluetooth adaptér"
hintMQTT="Tento způsob přenosu je doporučený, protože nevyžaduje dotazování z Miniserveru. MQTT Gateway přenáší data pomocí volání API (HTTP Web API). Veškerá nastavení MQTT se přebírají z <b>'MQTT Basics'</b> v LoxBerry."
hintMQTTTopic="Formát a požadované virtuální vstupy najdete v části <b>'Stav a načítání'</b>. Formát je /<MQTT prefix>/<MAC adresa>/<parametr>, např. /flowermon/c47c8d66275b/temperature. Při přechodu ze starého pluginu použijte téma <b>'miflora'</b>, chcete-li zachovat stávající MQTT témata. Téma, MAC adresa a název senzoru jsou malými písmeny. Nepoužívejte speciální znaky (+ nebo #), které mají v protokolu MQTT zvláštní význam."
hintUDP="Tento alternativní přenos je určen hlavně pro přechod ze stávajících instalací. Data se odesílají přímo do Miniserveru a je nutné je tam zpracovat pomocí UDP vstupů. Používání UDP současně s MQTT se NEDOPORUČUJE. Miniserver a UDP port jsou vyžadovány pouze při povoleném UDP přenosu. Formát zůstává zachován: C47C8D66275B.Temperature=27.1"
hintDiagnostics="Pomocí <b>'Načíst nyní'</b> spusťte ruční načítání a vyhledejte své senzory MiFlora včetně MAC adres a aktuálních hodnot. Níže jsou uvedeny virtuální vstupy potřebné pro přenos a zpracování hodnot těchto senzorů v Miniserveru. Tyto vstupy je ještě nutné v Miniserveru vytvořit. Načítání proběhne jednou s uloženým nastavením. Průběh se obnovuje každou sekundu. Podrobnosti o jednotlivých načítáních najdete v protokolech."

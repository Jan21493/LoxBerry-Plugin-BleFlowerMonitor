hintTextInputs="<b>Textové hodnoty:</b> Pro Name, Firmware a PollTimeString vytvořte <b><i>'virtuální textový vstup'</i></b> s odpovídajícím názvem místo <b><i>'příkazu virtuálního HTTP vstupu'</i></b>. Text může do Miniserveru přenášet přes API pouze MQTT Gateway."
hintUDPText="Rozpoznávání UDP příkazu =\v platí pouze pro čísla. Textové hodnoty (Name, Firmware, PollTimeString) nejsou podporovány."
gatewayV2Active="Je vybrána MQTT Gateway verze 2, výborně!"
gatewayV2Recommended="MQTT Gateway verze 2 není vybrána, ale v LoxBerry 4 je doporučena kvůli efektivitě."
hintGatewayV2="<b>Důležité:</b> MQTT Gateway verze 2 automaticky neodebírá všechna témata. Vyberte konkrétní témata, která chcete předávat do Miniserveru. Zde je stručný návod pro přenos HTTP/API:"
gatewayStep1="Otevřete nabídku <b><i>'MQTT Gateway'</i></b>, kartu <b><i>'Odběry'</i></b>. V případě potřeby rozbalte složky, jednotlivě zaškrtněte požadovaná témata a přiřaďte je Miniserveru. V novějších verzích LoxBerry můžete také vyhledat nastavená témata v Miniserveru, pokud tam již byla vytvořena. <b>Důležité:</b> Neodebírejte celou složku, pokud skutečně nepotřebujete všechna témata v ní."
gatewayStep2="Otevřete kartu <b><i>'Provoz'</i></b>. Témata se zobrazují s názvy virtuálních vstupů a lze je přímo zkopírovat. Odpovídající názvy můžete také zkopírovat z tabulky níže. Použijte názvy přesně tak, jak jsou uvedeny!"
gatewayStep3="V Loxone Config vytvořte <b><i>'virtuální HTTP vstup'</i></b> jako složku pro odebíraná témata. Do pole <b><i>'URL'</i></b> zadejte jedinou tečku (<code>.</code>), aby se nezobrazovala varování o chybějících parametrech."
gatewayStep4="Pro každou číselnou hodnotu vytvořte <b><i>'příkaz virtuálního HTTP vstupu'</i></b> a vložte odpovídající název vstupu do pole <b><i>'Název'</i></b>. <b>Důležité:</b> Dodržujte velikost písmen. Do pole <b><i>'rozpoznávání příkazu'</i></b> zadejte <code>\.</code> pro splnění kontroly povinného pole. <b>HTTP dotazování se NEPOUŽÍVÁ!</b> MQTT Gateway odesílá hodnoty do Miniserveru pomocí volání API. Pro textové hodnoty použijte <b><i>'virtuální textové vstupy'</i></b>."
gatewayStep5="Nahrajte aktualizovanou konfiguraci Loxone Config do Miniserveru."
gatewayChangedValues="<b>Poznámka:</b> MQTT Gateway předává pouze změněné hodnoty. Po vytvoření vstupů počkejte na změnu hodnoty nebo stiskněte <b><i>'Znovu odeslat vše'</i></b> v nabídce <b><i>'MQTT Gateway'</i></b> na kartě <b><i>'Provoz'</i></b>."
errLogList="Nepodařilo se načíst standardní zobrazení protokolů LoxBerry. Zkontrolujte LoxBerry Log Manager a systémový protokol."
gatewayAvailable="Byla nalezena konfigurace MQTT; přenos používá nastavení z <b>'MQTT Basics'</b> v LoxBerry."
gatewayUnavailable="Nebyla nalezena konfigurace MQTT brokeru. Zkontrolujte všechna nastavení LoxBerry v nabídce <b>'MQTT Gateway'</b>, zejména <b>'MQTT Basics'</b>."
errGatewayConfig="Nepodařilo se načíst verzi MQTT Gateway ze souboru general.json v LoxBerry. Zkontrolujte konfiguraci systému a protokol pluginu."
hintSensorInfo="Standardní načítání vrací těchto devět hodnot. MAC adresa a RSSI (síla přijímaného signálu v dBm) se zobrazují jako diagnostika v živém protokolu; vzdálenost v metrech je pouze hrubý odhad ve volném prostoru, nikoli měření senzoru. RSSI se nepublikuje jako měřená hodnota. Samostatná hodnota pH, vlhkosti vzduchu ani názvu rostliny není dostupná. Světlo se udává jako osvětlenost v luxech (lx), nikoli jako světelný tok v lumenech."

sectionLoxone="Virtuální vstupy v Loxone Config"
hintLoxone="Příklady používají uložené MQTT téma a vybranou MAC adresu. Vyberte jeden z nalezených senzorů nebo pomocí <b>'Upravit'</b> zadejte jinou MAC adresu. Pokud nebyl nalezen žádný senzor, zobrazí se ukázková adresa. Tento výběr mění pouze průvodce nastavením, nikoli nastavené přenosy."

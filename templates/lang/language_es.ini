heading="BLE Flower Monitor"
pluginIntro="El plugin BLE Flower Monitor consulta por Bluetooth Low Energy (BLE) sensores de plantas compatibles como <b>Xiaomi Mi Flora</b> (también conocido como <b>HHCC Flower Care</b>, <b>VegTrug Flora Sensor</b> o <b>Wanfei plant monitor</b>) y modelos relacionados como HHCC Flower Care Max y HHCC Touch. Todos estos sensores utilizan el mismo protocolo. El plugin es un sucesor desarrollado de forma independiente del <b>plugin Xiaomi Mi Flora Flower Monitor</b> de Michael Miklis, ya descontinuado, y conserva partes de su configuración e interfaz. La moderna interfaz BlueZ D-Bus permite usarlo en muchos sistemas Linux; admite adaptadores integrados de Raspberry Pi y adaptadores Bluetooth USB."
sectionGeneral="General e intervalo de consulta"
sectionBluetooth="Bluetooth / BlueZ D-Bus"
sectionMiniserver="Enviar al Miniserver"
sectionMQTT="MQTT (recomendado)"
sectionUDP="UDP (alternativa)"
sectionDiagnostics="Consultas y diagnóstico"
hintGeneral="Cuando está activado, el plugin busca sensores de plantas compatibles por Bluetooth Low Energy (BLE) con el intervalo horario seleccionado y los lee uno tras otro."
hintLocaltime="La hora interna del Miniserver cuenta los segundos desde el 01/01/2009 a las 00:00:00 en su zona horaria local. Esta opción aplica la zona horaria local de LoxBerry a la marca de tiempo de Loxone (parámetro <b>'PollTime'</b>). De lo contrario se utiliza UTC. <b>'PollTimeString'</b> proporciona la hora en un formato legible."
hintBluetooth="Configuración del adaptador Bluetooth para comunicarse con los sensores. El plugin detecta sensores mediante una búsqueda BLE y después lee las mediciones por GATT. En Linux, la biblioteca Python Bleak accede a Bluetooth mediante la interfaz BlueZ D-Bus: BlueZ proporciona el servicio Bluetooth y D-Bus permite que los programas se comuniquen con él. Se requiere un adaptador compatible con BLE (Bluetooth 4.0 o posterior; BLE 5 no es necesario), BlueZ 5.55 o posterior y un adaptador encendido y no bloqueado."
lblBTAdapter="Adaptador Bluetooth"
hintBTAdapter="Default utiliza siempre hci0. USB y Onboard seleccionan el primer adaptador del tipo correspondiente en cada consulta. Si no hay ninguno disponible, se informa de un error; el plugin no cambia automáticamente a otro tipo."
lblDetectedAdapters="Adaptadores Bluetooth instalados"
adapterSerial="Integrado"
adapterUSB="USB"
adapterMissing="No se ha detectado ningún adaptador Bluetooth del tipo seleccionado"
hintMQTT="Es el transporte recomendado porque no requiere consultas desde el Miniserver. MQTT Gateway transfiere los datos mediante llamadas a la API (HTTP Web API). Toda la configuración MQTT se obtiene de <b>'MQTT Basics'</b> de LoxBerry."
hintMQTTTopic="Consulta el formato y las entradas virtuales necesarias en <b>'Estado y consultas'</b>. El formato es /<prefijo MQTT>/<dirección MAC>/<parámetro>, p. ej. /flowermon/c47c8d66275b/temperature. Utiliza <b>'miflora'</b> como tema al migrar del plugin antiguo para conservar los temas MQTT existentes. El tema, la dirección MAC y el nombre del sensor se escriben en minúsculas. No utilices caracteres especiales (+ o #), ya que tienen un significado específico en MQTT."
hintUDP="Este transporte alternativo está pensado principalmente para migrar instalaciones existentes. Los datos se envían directamente al Miniserver y deben procesarse allí mediante entradas UDP. NO se recomienda usar UDP junto con MQTT. Solo se requieren un Miniserver y un puerto UDP si el envío UDP está activado. Se conserva el formato: C47C8D66275B.Temperature=27.1"
hintDiagnostics="Utiliza <b>'Consultar ahora'</b> para iniciar una consulta manual y descubrir tus sensores MiFlora, incluidas sus direcciones MAC y mediciones actuales. Debajo se muestran las entradas virtuales necesarias para transferir y procesar los valores de estos sensores en el Miniserver. Aún debes crear estas entradas en el Miniserver. La consulta se ejecuta una vez con la configuración guardada. El progreso se actualiza cada segundo. Consulta los registros para ver los detalles de cada consulta."
msgSaved="Configuración guardada."

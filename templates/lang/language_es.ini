sectionLoxone="Entradas virtuales en Loxone Config"
hintLoxone="Los ejemplos utilizan el tema MQTT guardado y la dirección MAC seleccionada. Selecciona uno de los sensores descubiertos o utiliza <b>'Editar'</b> para introducir otra dirección MAC. Se muestra una dirección de ejemplo si no se ha encontrado ningún sensor. Esta selección solo modifica la guía de configuración, no los transportes configurados."
transport="Transporte"
mqttRecommended="MQTT (recomendado)"
sensorMac="Dirección MAC del sensor"
errMAC="Introduce una dirección MAC de 12 caracteres hexadecimales, opcionalmente separados por dos puntos."
hintLoxoneMQTT="Abre <b><i>'MQTT Gateway'</i></b> en <b><i>'MQTT Basics'</i></b> de LoxBerry, añade la suscripción indicada debajo y asigna los temas deseados al Miniserver. Para el envío HTTP desde el gateway, crea entradas virtuales en Loxone Config con los nombres indicados. <b>Importante:</b> El plugin publica los temas completamente en minúsculas; el gateway sustituye /, espacios y % por _ en los nombres de entrada. MQTT por sí solo no crea entradas en Loxone Config."
subscription="Suscripción de MQTT Gateway"
hintGatewayUDP="Si MQTT Gateway envía al Miniserver mediante UDP en vez de HTTP, se aplican su puerto UDP y su formato de comando. Los nombres de entradas virtuales mostrados aquí se refieren a HTTP. La opción UDP de abajo describe la salida UDP directa de este plugin, no la del gateway."
hintLoxoneUDP="Activa UDP en el plugin y guarda. En Loxone Config, crea una <b><i>'entrada UDP virtual'</i></b> en el puerto configurado y un <b><i>'comando de entrada UDP virtual'</i></b> por cada medición dentro de ella. Copia el <b><i>'reconocimiento de comando'</i></b> de la tabla. <b>Importante:</b> Las direcciones MAC deben estar en mayúsculas sin dos puntos, los nombres de parámetros deben respetar las mayúsculas y minúsculas exactas y se debe indicar <code>=\v</code> para los valores numéricos."

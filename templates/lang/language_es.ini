hintTextInputs="<b>Valores de texto:</b> Para Name, Firmware y PollTimeString, crea una <b><i>'entrada de texto virtual'</i></b> con el nombre correspondiente en lugar de un <b><i>'comando de entrada HTTP virtual'</i></b>. Solo MQTT Gateway puede transferir texto al Miniserver mediante la API."
hintUDPText="El reconocimiento de comando UDP =\v solo se aplica a números. No se admiten valores de texto (Name, Firmware, PollTimeString)."
gatewayV2Active="¡MQTT Gateway versión 2 está seleccionado, perfecto!"
gatewayV2Recommended="MQTT Gateway versión 2 no está seleccionado, pero se recomienda por su eficiencia en LoxBerry 4."
hintGatewayV2="<b>Importante:</b> MQTT Gateway versión 2 no se suscribe automáticamente a todos los temas. Selecciona los temas específicos que quieras reenviar al Miniserver. A continuación se ofrecen dos breves guías para el envío por HTTP/API:"
gatewayStep1="Abre el menú <b><i>'MQTT Gateway'</i></b>, pestaña <b><i>'Suscripciones'</i></b>. Expande las carpetas si es necesario, marca los temas deseados individualmente y asígnalos al Miniserver. En versiones más recientes de LoxBerry también puedes buscar en el Miniserver los temas configurados si ya se han creado allí. <b>Importante:</b> No te suscribas a una carpeta completa a menos que necesites todos sus temas."
gatewayStep2="Abre la pestaña <b><i>'Tráfico'</i></b>. Los temas se muestran con los nombres de las entradas virtuales y pueden copiarse directamente. También puedes copiar los nombres correspondientes de la tabla inferior. ¡Utiliza los nombres exactamente como aparecen!"
gatewayStep3="En Loxone Config, crea una <b><i>'entrada HTTP virtual'</i></b> como carpeta para los temas suscritos. En su <b><i>'URL'</i></b>, introduce un único punto (<code>.</code>) para evitar avisos de parámetros ausentes."
gatewayStep4="Crea un <b><i>'comando de entrada HTTP virtual'</i></b> para cada valor numérico y pega el nombre de entrada correspondiente en <b><i>'Nombre'</i></b>. <b>Importante:</b> Respeta las mayúsculas y minúsculas. En <b><i>'reconocimiento de comando'</i></b>, introduce <code>\.</code> para cumplir la comprobación de campo obligatorio. <b>¡NO se utilizan consultas HTTP!</b> MQTT Gateway envía los valores al Miniserver mediante llamadas a la API. Para los valores de texto utiliza <b><i>'entradas de texto virtuales'</i></b>."
gatewayStep5="Transfiere la configuración actualizada de Loxone Config al Miniserver."
gatewayChangedValues="<b>Nota:</b> MQTT Gateway solo reenvía valores modificados. Tras crear las entradas, espera a que cambie algún valor o pulsa <b><i>'Reenviar todo'</i></b> en el menú <b><i>'MQTT Gateway'</i></b>, pestaña <b><i>'Tráfico'</i></b>."
errLogList="No se ha podido cargar la vista estándar de registros de LoxBerry. Comprueba LoxBerry Log Manager y el registro del sistema."
gatewayAvailable="Se ha encontrado una configuración MQTT; el envío utiliza los ajustes de <b>'MQTT Basics'</b> de LoxBerry."
gatewayUnavailable="No se ha encontrado ninguna configuración del broker MQTT. Comprueba todos los ajustes de LoxBerry en el menú <b>'MQTT Gateway'</b>, especialmente en <b>'MQTT Basics'</b>."
errGatewayConfig="No se ha podido leer la versión de MQTT Gateway de general.json de LoxBerry. Comprueba la configuración del sistema y el registro del plugin."
hintSensorInfo="La consulta estándar devuelve estos nueve valores. La dirección MAC y el RSSI (intensidad de señal recibida en dBm) aparecen como diagnóstico en el registro en directo; la distancia en metros es solo una estimación aproximada en espacio libre, no una medición del sensor. El RSSI no se publica como medición. No hay un valor separado de pH, humedad del aire o nombre de la planta. La luz se expresa como iluminancia en lux (lx), no como flujo luminoso en lúmenes."

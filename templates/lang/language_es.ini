hintLogs="Cada consulta manual o programada crea una sesión de registro de LoxBerry en el grupo <b>'FlowerCare'</b> con el nivel seleccionado. <b>'Debug'</b> contiene el mayor detalle; los demás niveles contienen menos información. Los archivos se guardan en el directorio de registros del plugin, en un disco RAM, y terminan en _xiaomi-miflora.log. LoxBerry gestiona la eliminación de registros antiguos. Los registros del disco RAM pueden desaparecer tras reiniciar."

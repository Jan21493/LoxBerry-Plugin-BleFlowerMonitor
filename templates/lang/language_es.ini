templateStep6="En LoxBerry, en <b><i>'MQTT Gateway'</i></b>, escanea el Miniserver en la pestaña <b><i>'Suscripciones'</i></b> y suscríbete a las entradas virtuales encontradas."
guideStep6V1="En LoxBerry, en <b><i>'MQTT Gateway'</i></b>, añade la siguiente entrada en la pestaña <b><i>'Suscripciones'</i></b>:"

templateStep1="Crea una plantilla con el botón <b><i>'Exportar plantilla'</i></b> y ajusta las denominaciones como desees."
templateStep2="En Loxone Config, selecciona <b><i>'Entradas virtuales'</i></b> en el árbol de periféricos."
templateStep3="Añade la plantilla con <b><i>'Importar plantilla'</i></b> en el botón <b><i>'Dispositivos HTTP predefinidos'</i></b> y selecciónala después en <b><i>'Mis plantillas'</i></b>."
tplMqttOnly="La plantilla solo funciona con el envío recomendado vía MQTT al Miniserver."
templateStep4="Arrastra los <b><i>'comandos de entrada virtual HTTP'</i></b> añadidos desde el árbol de periféricos a la configuración, ajusta la estancia/categoría si es necesario y conéctalos con la lógica deseada."

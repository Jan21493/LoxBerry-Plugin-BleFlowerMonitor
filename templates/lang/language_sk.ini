heading="BLE Flower Monitor"
pluginIntro="Plugin BLE Flower Monitor načítava cez Bluetooth Low Energy (BLE) kompatibilné senzory pre rastliny, napríklad <b>Xiaomi Mi Flora</b> (známe aj ako <b>HHCC Flower Care</b>, <b>VegTrug Flora Sensor</b> alebo <b>Wanfei plant monitor</b>), a príbuzné modely HHCC Flower Care Max a HHCC Touch. Všetky tieto senzory používajú rovnaký protokol. Plugin je nezávisle vyvinutým nástupcom už nevyvíjaného <b>pluginu Xiaomi Mi Flora Flower Monitor</b> od Michaela Miklisa a zachováva časti jeho nastavení a zobrazenia. Moderné rozhranie BlueZ D-Bus umožňuje použitie na mnohých systémoch Linux; podporované sú integrované adaptéry Raspberry Pi aj USB Bluetooth adaptéry."
sectionGeneral="Všeobecné nastavenia a interval načítania"
sectionBluetooth="Bluetooth / BlueZ D-Bus"
sectionMiniserver="Odosielanie do Miniservera"
sectionMQTT="MQTT (odporúčané)"
sectionUDP="UDP (alternatíva)"
sectionDiagnostics="Načítanie a diagnostika"
hintGeneral="Ak je plugin povolený, vyhľadáva vo zvolenom hodinovom intervale kompatibilné senzory pre rastliny cez Bluetooth Low Energy (BLE) a postupne ich načítava."
hintLocaltime="Interný čas Miniservera počíta sekundy od 1. 1. 2009 00:00:00 v jeho miestnom časovom pásme. Tento prepínač zohľadňuje miestne časové pásmo LoxBerry v časovej pečiatke Loxone (parameter <b>'PollTime'</b>). Inak sa používa UTC. <b>'PollTimeString'</b> poskytuje čas v čitateľnom formáte."
hintBluetooth="Nastavenia Bluetooth adaptéra na komunikáciu so senzormi. Plugin vyhľadá senzory pri BLE skenovaní a následne načíta hodnoty cez GATT. V Linuxe knižnica Python Bleak pristupuje k Bluetooth cez rozhranie BlueZ D-Bus: BlueZ zabezpečuje službu Bluetooth a D-Bus umožňuje programom s ňou komunikovať. Vyžaduje sa adaptér s podporou BLE (Bluetooth 4.0 alebo novší; BLE 5 nie je nutné), BlueZ 5.55 alebo novší a zapnutý, neblokovaný adaptér."
lblBTAdapter="Bluetooth adaptér"
hintBTAdapter="Default vždy používa hci0. USB a Onboard pri každom načítaní vyberú prvý zodpovedajúci adaptér daného typu. Ak zodpovedajúci adaptér nie je dostupný, zobrazí sa chyba; plugin automaticky neprejde na iný typ."
lblDetectedAdapters="Nainštalované Bluetooth adaptéry"
adapterSerial="Integrovaný"
adapterUSB="USB"
adapterMissing="Nenašiel sa zodpovedajúci Bluetooth adaptér"
hintMQTT="Tento spôsob prenosu je odporúčaný, pretože nevyžaduje dopytovanie z Miniservera. MQTT Gateway prenáša údaje pomocou volaní API (HTTP Web API). Všetky nastavenia MQTT sa preberajú z <b>'MQTT Basics'</b> v LoxBerry."
hintMQTTTopic="Formát a požadované virtuálne vstupy nájdete v časti <b>'Stav a načítania'</b>. Formát je /<MQTT prefix>/<MAC adresa>/<parameter>, napr. /flowermon/c47c8d66275b/temperature. Pri prechode zo starého pluginu použite tému <b>'miflora'</b>, ak chcete zachovať existujúce MQTT témy. Téma, MAC adresa a názov senzora sú malými písmenami. Nepoužívajte špeciálne znaky (+ alebo #), ktoré majú v protokole MQTT osobitný význam."
hintUDP="Tento alternatívny prenos je určený hlavne na prechod z existujúcich inštalácií. Údaje sa odosielajú priamo do Miniservera a je potrebné ich tam spracovať pomocou UDP vstupov. Používanie UDP súčasne s MQTT sa NEODPORÚČA. Miniserver a UDP port sú potrebné len pri povolenom UDP prenose. Formát zostáva zachovaný: C47C8D66275B.Temperature=27.1"
hintDiagnostics="Pomocou <b>'Načítať teraz'</b> spustite ručné načítanie a vyhľadajte svoje senzory MiFlora vrátane MAC adries a aktuálnych hodnôt. Nižšie sú uvedené virtuálne vstupy potrebné na prenos a spracovanie hodnôt týchto senzorov v Miniserveri. Tieto vstupy je ešte potrebné v Miniserveri vytvoriť. Načítanie prebehne raz s uloženými nastaveniami. Priebeh sa obnovuje každú sekundu. Podrobnosti o jednotlivých načítaniach nájdete v protokoloch."

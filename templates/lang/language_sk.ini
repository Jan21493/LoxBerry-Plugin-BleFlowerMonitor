guideManualTitle="Ručné vytvorenie virtuálnych vstupov v Loxone Config"
guideTemplateTitle="Import virtuálnych vstupov do Loxone Config pomocou šablóny"
templateStep1="Vytvorte šablónu tlačidlom <b><i>'Exportovať šablónu'</i></b> a upravte označenia podľa potreby."
templateStep2="V Loxone Config vyberte v strome periférií <b><i>'Virtuálne vstupy'</i></b>."
templateStep3="Pridajte šablónu pomocou <b><i>'Importovať šablónu'</i></b> pod tlačidlom <b><i>'Preddefinované HTTP zariadenia'</i></b> a potom ju vyberte v <b><i>'Moje šablóny'</i></b>."
tplMqttOnly="Šablóna funguje iba s odporúčaným prenosom cez MQTT do Miniservera."
templateStep4="Presuňte pridané <b><i>'virtuálne HTTP vstupné príkazy'</i></b> zo stromu periférií do konfigurácie, prípadne upravte miestnosť/kategóriu a prepojte ich s požadovanou logikou."
templateStep5="Uložte konfiguráciu do Miniservera."
templateStep6="V LoxBerry v <b><i>'MQTT Gateway'</i></b> vyberte verziu 2, na karte <b><i>'Odbery'</i></b> naskenujte Miniserver a prihláste odber nájdených virtuálnych vstupov."

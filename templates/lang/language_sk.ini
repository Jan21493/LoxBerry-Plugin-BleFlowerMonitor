sectionLoxone="Virtuálne vstupy v Loxone Config"
hintLoxone="Príklady používajú uloženú MQTT tému a vybranú MAC adresu. Vyberte jeden z nájdených senzorov alebo pomocou <b>'Upraviť'</b> zadajte inú MAC adresu. Ak sa nenašiel žiadny senzor, zobrazí sa ukážková adresa. Tento výber mení iba sprievodcu nastavením, nie nastavené prenosy."
transport="Spôsob prenosu"
mqttRecommended="MQTT (odporúčané)"
sensorMac="MAC adresa senzora"
errMAC="Zadajte MAC adresu s 12 šestnástkovými znakmi, prípadne oddelenými dvojbodkami."
hintLoxoneMQTT="Otvorte <b><i>'MQTT Gateway'</i></b> v <b><i>'MQTT Basics'</i></b> v LoxBerry, pridajte nižšie uvedený odber a priraďte požadované témy Miniserveru. Pre prenos HTTP z gateway vytvorte v Loxone Config virtuálne vstupy s uvedenými názvami. <b>Dôležité:</b> Plugin publikuje témy iba malými písmenami; gateway nahrádza /, medzery a % v názvoch vstupov znakom _. Samotné MQTT nevytvára vstupy v Loxone Config."
subscription="Odber MQTT Gateway"
hintGatewayUDP="Ak MQTT Gateway odosiela do Miniservera cez UDP namiesto HTTP, použite jej UDP port a formát príkazu. Tu uvedené názvy virtuálnych vstupov sa vzťahujú na HTTP. Voľba UDP nižšie opisuje priamy UDP výstup tohto pluginu, nie gateway."
hintLoxoneUDP="Povoľte UDP v plugine a uložte nastavenia. V Loxone Config vytvorte <b><i>'virtuálny UDP vstup'</i></b> na nastavenom porte a pod ním <b><i>'príkaz virtuálneho UDP vstupu'</i></b> pre každú hodnotu. Z tabuľky skopírujte <b><i>'rozpoznávanie príkazu'</i></b>. <b>Dôležité:</b> MAC adresy musia byť veľkými písmenami bez dvojbodiek, názvy parametrov musia presne dodržiavať veľkosť písmen a pre číselné hodnoty musí byť uvedené <code>=\v</code>."

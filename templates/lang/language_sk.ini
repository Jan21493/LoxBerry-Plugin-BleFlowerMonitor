tplHint="Vytvorí šablónu virtuálneho HTTP vstupu s jedným virtuálnym HTTP vstupným príkazom pre každý senzor a hodnotu. Názov každého príkazu presne zodpovedá názvu virtuálneho vstupu, popis sa skladá z názvu senzora a označenia parametra. Súbor importujte v Loxone Config pomocou Importovať šablónu."

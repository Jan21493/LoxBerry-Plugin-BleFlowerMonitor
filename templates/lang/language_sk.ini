hintTextInputs="<b>Textové hodnoty:</b> Pre Name, Firmware a PollTimeString vytvorte <b><i>'virtuálny textový vstup'</i></b> so zodpovedajúcim názvom namiesto <b><i>'príkazu virtuálneho HTTP vstupu'</i></b>. Text môže do Miniservera prenášať cez API iba MQTT Gateway."
hintUDPText="Rozpoznávanie UDP príkazu =\v platí iba pre čísla. Textové hodnoty (Name, Firmware, PollTimeString) nie sú podporované."
gatewayV2Active="Je vybraná MQTT Gateway verzie 2, výborne!"
gatewayV2Recommended="MQTT Gateway verzie 2 nie je vybraná, ale v LoxBerry 4 je odporúčaná kvôli efektivite."
hintGatewayV2="<b>Dôležité:</b> MQTT Gateway verzie 2 automaticky neodoberá všetky témy. Vyberte konkrétne témy, ktoré chcete preposielať do Miniservera. Tu sú dva stručné návody na prenos HTTP/API:"
gatewayStep1="Otvorte ponuku <b><i>'MQTT Gateway'</i></b>, kartu <b><i>'Odbery'</i></b>. V prípade potreby rozbaľte priečinky, jednotlivo začiarknite požadované témy a priraďte ich Miniserveru. V novších verziách LoxBerry môžete tiež vyhľadať nastavené témy v Miniserveri, ak tam už boli vytvorené. <b>Dôležité:</b> Neodoberajte celý priečinok, ak skutočne nepotrebujete všetky témy v ňom."
gatewayStep2="Otvorte kartu <b><i>'Prevádzka'</i></b>. Témy sa zobrazujú s názvami virtuálnych vstupov a možno ich priamo skopírovať. Zodpovedajúce názvy môžete tiež skopírovať z tabuľky nižšie. Použite názvy presne tak, ako sú uvedené!"
gatewayStep3="V Loxone Config vytvorte <b><i>'virtuálny HTTP vstup'</i></b> ako priečinok pre odoberané témy. Do poľa <b><i>'URL'</i></b> zadajte jedinú bodku (<code>.</code>), aby sa nezobrazovali upozornenia na chýbajúce parametre."
gatewayStep4="Pre každú číselnú hodnotu vytvorte <b><i>'príkaz virtuálneho HTTP vstupu'</i></b> a vložte zodpovedajúci názov vstupu do poľa <b><i>'Názov'</i></b>. <b>Dôležité:</b> Dodržiavajte veľkosť písmen. Do poľa <b><i>'rozpoznávanie príkazu'</i></b> zadajte <code>\.</code> na splnenie kontroly povinného poľa. <b>HTTP dopytovanie sa NEPOUŽÍVA!</b> MQTT Gateway odosiela hodnoty do Miniservera pomocou volaní API. Pre textové hodnoty použite <b><i>'virtuálne textové vstupy'</i></b>."
gatewayStep5="Nahrajte aktualizovanú konfiguráciu Loxone Config do Miniservera."
gatewayChangedValues="<b>Poznámka:</b> MQTT Gateway preposiela iba zmenené hodnoty. Po vytvorení vstupov počkajte na zmenu hodnoty alebo stlačte <b><i>'Znova odoslať všetko'</i></b> v ponuke <b><i>'MQTT Gateway'</i></b> na karte <b><i>'Prevádzka'</i></b>."
errLogList="Nepodarilo sa načítať štandardné zobrazenie protokolov LoxBerry. Skontrolujte LoxBerry Log Manager a systémový protokol."
gatewayAvailable="Našla sa konfigurácia MQTT; prenos používa nastavenia z <b>'MQTT Basics'</b> v LoxBerry."
gatewayUnavailable="Nenašla sa konfigurácia MQTT brokera. Skontrolujte všetky nastavenia LoxBerry v ponuke <b>'MQTT Gateway'</b>, najmä <b>'MQTT Basics'</b>."
errGatewayConfig="Nepodarilo sa načítať verziu MQTT Gateway zo súboru general.json v LoxBerry. Skontrolujte konfiguráciu systému a protokol pluginu."
hintSensorInfo="Štandardné načítanie vracia týchto deväť hodnôt. MAC adresa a RSSI (sila prijímaného signálu v dBm) sa zobrazujú ako diagnostika v živom protokole; vzdialenosť v metroch je iba hrubý odhad vo voľnom priestore, nie meranie senzora. RSSI sa nepublikuje ako meraná hodnota. Samostatná hodnota pH, vlhkosti vzduchu ani názvu rastliny nie je dostupná. Svetlo sa udáva ako osvetlenosť v luxoch (lx), nie ako svetelný tok v lúmenoch."

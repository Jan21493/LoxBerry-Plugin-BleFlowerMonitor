hintLogs="Každé ručné alebo plánované načítanie vytvorí reláciu protokolu LoxBerry v skupine <b>'FlowerCare'</b> so zvolenou úrovňou. <b>'Debug'</b> obsahuje najviac podrobností; ostatné úrovne zodpovedajúcim spôsobom menej. Súbory sú uložené v adresári protokolov pluginu na RAM disku a končia na _xiaomi-miflora.log. Mazanie starých protokolov spravuje LoxBerry. Po reštarte môžu protokoly na RAM disku chýbať."

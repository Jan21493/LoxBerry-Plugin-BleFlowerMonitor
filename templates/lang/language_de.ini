hintGeneral="Das aktivierte Plugin sucht im gewählten Stundenintervall nach MiFlora-Sensoren und liest sie nacheinander aus."
hintLocaltime="Die intern vom Miniserver verwendete Zeit zählt ab 1.1.2009 00:00:00 Uhr in der lokalen Zeitzone des Miniservers. Der Schalter berücksichtigt die lokale Zeitzone des Loxberry im Loxone-Zeitstempel 'PollTime'. Alternativ wird UTC verwendet. 'PollTimeString' gibt die Zeit im Klartext aus."
hintBluetooth="Das Plugin verwendet eine moderne Bluetooth-Schnittstelle über Bleak und die standardisierte D-Bus-Schnittstelle von BlueZ und ist damit kompatibel mit vielen Linux-Systemen. Interne Raspberry-Pi-Adapter und USB-Bluetooth-Adapter werden unterstützt. BlueZ muss laufen und der Adapter eingeschaltet sein."
lblBTAdapter="Bluetooth-Adapter"
hintBTAdapter="Default - verwendet die erste verfügbare Schnittstelle, i.d.R. hci0. USB und Onboard wählen bei jeder Abfrage den ersten passenden Adapter für die ausgewählte Schnittstelle. Fehlt ein passender Adapter, wird ein Fehler ausgegeben."
lblDetectedAdapters="Installierte Bluetooth-Adapter"
adapterSerial="Onboard"
adapterUSB="USB"
adapterMissing="Kein passender Bluetooth-Adapter erkannt"
hintMQTT="Dies ist der empfohlene Übertragungsweg, weil kein Polling auf dem Miniserver erforderlich ist. Die Daten werden vom MQTT Gateway per API Aufruf (HTTP Web API) übertragen. Alle Einstellungen zu MQTT werden aus 'MQTT Basics' des Loxberrys übernommen."
hintMQTTTopic="Hinweise zum Format und benötigten virtuellen Eingängen findest Du unter 'Status und Abfragen'. Das Format ist /<MQTT Prefix>/<MAC-Adresse>/<Parameter>, z.B. /miflora/c47c8d66275b/temperature. Topic, MAC-Adresse und Sensorname werden kleingeschrieben. Keine Sonderzeichen (+ oder #) verwenden, da diese eine spezielle Bedeutung im MQTT-Protokoll haben."
hintUDP="Dies ist ein alternativer Übertragungsweg, der hauptsächlich für Migrationen von bestehenden Setups gedacht ist. Die Daten werden direkt an den Miniserver gesendet und müssen dort über UDP Inputs verarbeitet werden. Es ist NICHT sinnvoll, UDP neben MQTT zu verwenden. Miniserver und UDP-Port sind nur bei aktivierter UDP-Übertragung erforderlich. Das Format bleibt erhalten C47C8D66275B.Temperature=27.1"
hintDiagnostics="Über den Button 'Jetzt abfragen'kannst Du eine Abfrage manuell starten, um Deine vorhandenen MiFlora-Sensoren zu ermitteln, inklusive deren MAC-Adressen und aktuellen Messwerten. Weiter unten siehst Du die benötigten virtuellen Eingänge, um Werte dieser Sensoren an den Miniserver zu übertragen und weiterzuverarbeiten. Diese erforderlichen Eingänge must Du dafür noch im Miniserver angelegen. Die Abfrage startet einmalig mit den gespeicherten Einstellungen. Der Fortschritt wird jede Sekunde aktualisiert. Details zur jeweiligen Abfrage findest Du in den Logs."
msgSaved="Einstellungen gespeichert."
errInvalidInput="Ungültige Einstellungen. Bitte Eingaben und Auswahl prüfen."
errOutputRequired="Fehler: Du musst mindestens einen Übertragungsweg aktivieren - MQTT (empfohlen) oder UDP."
errMQTT="MQTT benötigt ein Topic ohne Platzhalter. Den Broker bitte unter LoxBerry im Menü 'MQTT Basics' konfigurieren."
errPort="Der Port muss eine ganze Zahl zwischen 1 und 65535 sein."
errMiniserver="UDP benötigt einen im LoxBerry konfigurierten Miniserver."
errSave="Die Einstellungen konnten nicht gespeichert werden."
errAdapterInventory="Der Bluetooth-Adapter konnten nicht ermittelt werden. Bitte Systemberechtigungen und Plugin-Log prüfen."
errAdapterMigration="Die bisherige hci-Auswahl wird durch einen Adaptertyp ersetzt. Bitte USB oder Onboard prüfen und speichern."
errPoll="Die Abfrage konnte nicht gestartet werden."

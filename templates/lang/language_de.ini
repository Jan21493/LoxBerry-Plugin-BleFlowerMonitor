hintLogs="Jede manuelle und geplante Abfrage erzeugt eine LoxBerry-Logsession in der Gruppe <b>'FlowerCare'</b> mit dem angegebenen Level. Der Level <b>'Debug'</b> enthält die meisten Details, die anderen Levels entsprechend weniger. Die Dateien liegen im Logverzeichnis des Plugins auf einer RAM-Disk und enden auf _xiaomi-miflora.log. Der LoxBerry verwaltet das Löschen alter Logs. Logs auf der RAM-Disk können nach einem Neustart fehlen."

hintTextInputs="<b>Textwerte:</b> Für Name, Firmware und PollTimeString statt eines <b><i>'virtuellen HTTP-Eingangsbefehls'</i></b> einen <b><i>'virtuellen Texteingang'</i></b> mit dem passenden Namen anlegen. Auch diese Texte kann das MQTT Gateway per API an den Miniserver übertragen."
hintUDPText="Die UDP-Befehlserkennung =\v gilt nur für Zahlen, nicht für die Textwerte Name, Firmware und PollTimeString."
gatewayV2Active="MQTT Gateway Version 2 ist ausgewählt."
gatewayV2Recommended="MQTT Gateway Version 2 ist nicht ausgewählt, wird unter LoxBerry 4 aber aus Effizienzgründen empfohlen."
hintGatewayV2="<b>Wichtig:</b> Es gibt kein automatisches Abonnement aller Topics. Wählen Sie gezielt die Topics, die an Ihre Miniserver übertragen werden sollen. Vorgehen für HTTP/API-Übertragung:"
gatewayStep1="Im Menü <b><i>'MQTT Gateway'</i></b> den Tab <b><i>'Subscriptions'</i></b> öffnen. Ordner bei Bedarf aufklappen und die gewünschten Topics einzeln anhaken und dem Miniserver zuordnen. <b>Wichtig:</b> Nicht den ganzen Ordner abonnieren, außer Sie benötigen wirklich alle darunterliegenden Topics."
gatewayStep2="Den Tab <b><i>'Traffic'</i></b> öffnen und die Namen der abonnierten Topics bzw. virtuellen Eingänge kopieren. Die Tabelle unten zeigt die passenden Eingangsnamen für dieses Plugin."
gatewayStep3="In Loxone Config einen <b><i>'virtuellen HTTP-Eingang'</i></b> als Ordner für die abonnierten Topics anlegen. Als <b><i>'URL'</i></b> einen einzelnen Punkt (<code>.</code>) eintragen, damit Loxone Config keine fehlenden Parameter meldet."
gatewayStep4="Für jeden Zahlenwert einen <b><i>'virtuellen HTTP-Eingangsbefehl'</i></b> anlegen und den passenden Eingangsnamen exakt in das Feld <b><i>'Name'</i></b> einfügen. <b>Wichtig:</b> Groß-/Kleinschreibung beachten. Als <b><i>'Befehlserkennung'</i></b> <code>\.</code> eintragen, um die Pflichtfeldprüfung zu erfüllen. <b>HTTP-Polling wird nicht verwendet!</b> Das MQTT Gateway überträgt die Werte per API-Aufruf an den Miniserver. Für Textwerte stattdessen <b><i>'virtuelle Texteingänge'</i></b> verwenden."
gatewayStep5="Die ergänzte Loxone Config auf den Miniserver übertragen."
gatewayChangedValues="<b>Hinweis:</b> Nur geänderte Werte werden vom MQTT Gateway weitergeleitet. Nach dem Anlegen der Eingänge entweder auf eine Wertänderung warten oder im Menü <b><i>'MQTT Gateway'</i></b> unter <b><i>'Traffic'</i></b> auf <b><i>'Resend all'</i></b> klicken."
errLogList="Die Standard-Logansicht von LoxBerry konnte nicht geladen werden. LoxBerry Log Manager und System-Log prüfen."
gatewayAvailable="MQTT-Konfiguration gefunden; die Übertragung verwendet LoxBerry MQTT Basics."
gatewayUnavailable="Keine MQTT-Brokerkonfiguration gefunden. MQTT Basics und das MQTT Gateway prüfen."
errGatewayConfig="Die MQTT-Gateway-Version konnte nicht aus LoxBerrys general.json gelesen werden. Systemkonfiguration und Plugin-Log prüfen."
hintSensorInfo="Die Standardabfrage liefert diese neun Werte. MAC-Adresse und RSSI (Empfangsstärke in dBm) erscheinen als Diagnose im Live-Log; RSSI ist kein Bodensensorwert und wird nicht als Messwert übertragen. Kein separater pH-, Luftfeuchte- oder Pflanzenname-Wert. Light wird als Lux (lx), nicht als Lichtstrom in Lumen ausgegeben; das Wiki nennt beide Bezeichnungen uneinheitlich. Quelle:"

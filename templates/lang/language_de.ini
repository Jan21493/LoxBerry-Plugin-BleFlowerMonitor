adapterMissing="Kein passender Bluetooth-Adapter erkannt"
hintMQTT="Empfohlener Übertragungsweg. Broker, Port, Benutzername, Passwort und TLS-Einstellungen werden ausschließlich aus LoxBerrys MQTT Basics übernommen. Änderungen dort gelten bei der nächsten Übertragung. MQTT benötigt keinen konfigurierten Miniserver. Die Übertragung erfolgt mit QoS 1."
hintMQTTTopic="Format: miflora/c47c8d66275b/temperature. Topic, MAC-Adresse und Sensorname werden wie bisher kleingeschrieben. Keine Platzhalter (+ oder #) verwenden."
hintUDP="Optional zusätzlich zu MQTT oder allein nutzbar. Miniserver und UDP-Port sind nur bei aktivierter UDP-Übertragung erforderlich. Das bisherige Format bleibt erhalten: C47C8D66275B.Temperature=27.1"
hintDiagnostics="Jetzt abfragen startet einmalig mit den gespeicherten Einstellungen. Der Fortschritt wird jede Sekunde aktualisiert. Laufende Abfragen werden nicht doppelt gestartet. Das Plugin muss aktiviert sein. Details zur jeweiligen Abfrage stehen unter Logs."

hintBTAdapter="Wie bei TeslaCmd: Intern/UART und USB wählen den ersten passenden Adapter nach hci-Nummer. Alternativ einen bestimmten hci-Adapter auswählen. Fehlt der gewählte Adapter, wird ein Fehler ausgegeben – kein stiller Wechsel auf einen anderen Adapter."

hintBluetooth="Bleak verwendet die standardisierte D-Bus-Schnittstelle von BlueZ. Interne Raspberry-Pi-Adapter und USB-Bluetooth-Adapter werden unterstützt. BlueZ muss laufen und der Adapter eingeschaltet sein."
lblBTAdapter="Bluetooth-Adapter:"
hintBTAdapter="Default - hci0 verwendet immer hci0. USB und Onboard wählen wie bei TeslaCmd bei jeder Abfrage den ersten passenden Adapter nach hci-Nummer und bleiben bei wechselnden hci-Nummern gültig. Fehlt der gewählte Adapter oder Typ, wird ein Fehler ausgegeben – kein stiller Wechsel."

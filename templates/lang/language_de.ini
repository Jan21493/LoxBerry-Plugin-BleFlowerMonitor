hintMQTT="Empfohlener Übertragungsweg. Broker-Adresse und Zugangsdaten des MQTT-Brokers eintragen, beispielsweise vom LoxBerry MQTT Gateway. MQTT funktioniert auch ohne konfigurierten Miniserver. Die Übertragung erfolgt mit QoS 1."
hintMQTTTopic="Format: miflora/c47c8d66275b/temperature. Topic, MAC-Adresse und Sensorname werden wie bisher kleingeschrieben. Keine Platzhalter (+ oder #) verwenden."

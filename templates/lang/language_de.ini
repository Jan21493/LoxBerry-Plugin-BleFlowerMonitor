hintTextInputs="<b>Textwerte:</b> Für Name, Firmware und PollTimeString statt eines <b><i>'virtuellen HTTP-Eingangsbefehls'</i></b> einen <b><i>'virtuellen Texteingang'</i></b> mit dem passenden Namen anlegen. Texte kann nur das MQTT Gateway per API an den Miniserver übertragen."
hintUDPText="Die UDP-Befehlserkennung =\v gilt nur für Zahlen. Textwerte (Name, Firmware, PollTimeString) werden nicht unterstützt."
gatewayV2Active="MQTT Gateway Version 2 ist ausgewählt, sehr gut!"
gatewayV2Recommended="MQTT Gateway Version 2 ist nicht ausgewählt, wird unter LoxBerry 4 aber aus Effizienzgründen empfohlen."
hintGatewayV2="<b>Wichtig:</b> Es gibt beim MQTT Gateway Version 2 keine automatischen Abonnements aller Topics. Wähle gezielt die Topics, die an Deinen Miniserver übertragen werden sollen. Hier findest Du eine kurze Anleitung für HTTP/API-Übertragung:"
gatewayStep1="Im Menü <b><i>'MQTT Gateway'</i></b> den Tab <b><i>'Abonnements'</i></b> öffnen. Ordner bei Bedarf aufklappen und die gewünschten Topics einzeln anhaken und dem Miniserver zuordnen. Alternativ kannst Du in neueren Versionen des Loxberrys den Miniserver nach konfigurierten Topics scannen, sofern die Topics dort bereits angelegt sind. <b>Wichtig</b> Nicht den ganzen Ordner abonnieren, außer Du benötigst wirklich alle darunterliegenden Topics."
gatewayStep2="Den Tab <b><i>'Datenverkehr'</i></b> öffnen. Die Topics werden mit den Namen für die virtuellen Eingänge angezeigt und können direkt kopiert werden. Du kannst Die passenden Namen für die virtuellen Eingänge auch direkt aus der u.a. Tabelle entnehmen. Achte darauf, die Namen exakt zu übernehmen!"
gatewayStep3="In Loxone Config einen <b><i>'virtuellen HTTP-Eingang'</i></b> als Ordner für die abonnierten Topics anlegen. Als <b><i>'URL'</i></b> einen einzelnen Punkt (<code>.</code>) eintragen, damit Loxone Config keine fehlenden Parameter meldet."
gatewayStep4="Für jeden Zahlenwert einen <b><i>'virtuellen HTTP-Eingangsbefehl'</i></b> anlegen und den passenden Eingangsnamen exakt in das Feld <b><i>'Bezeichnung'</i></b> einfügen. <b>Wichtig</b> Groß-/Kleinschreibung beachten. Als <b><i>'Befehlserkennung'</i></b> <code>\.</code> eintragen, um die Pflichtfeldprüfung zu erfüllen. <b>HTTP-Polling wird nicht verwendet!</b> Das MQTT Gateway überträgt die Werte per API-Aufruf an den Miniserver. Für Textwerte stattdessen <b><i>'virtuelle Texteingänge'</i></b> verwenden."
gatewayStep5="Die ergänzte Loxone Config auf den Miniserver übertragen."
gatewayChangedValues="<b>Hinweis</b> Nur geänderte Werte werden vom MQTT Gateway weitergeleitet. Nach dem Anlegen der Eingänge entweder auf eine Wertänderung warten oder im Menü <b><i>'MQTT Gateway'</i></b> unter <b><i>'Datenverkehr'</i></b> auf <b><i>'Alle neu senden'</i></b> klicken."
errLogList="Die Standard-Logansicht von LoxBerry konnte nicht geladen werden. LoxBerry Log Manager und System-Log prüfen."
gatewayAvailable="MQTT-Konfiguration gefunden; die Übertragung verwendet die Einstellungen, die im LoxBerry unter 'MQTT Basics' konfiguriert sind."
gatewayUnavailable="Keine MQTT-Brokerkonfiguration gefunden. Überprüfe alle Einstellungen des LoxBerrys im Menü 'MQTT Gateway', insbesondere in den 'MQTT Basics'."
errGatewayConfig="Die MQTT-Gateway-Version konnte nicht aus LoxBerrys general.json gelesen werden. Systemkonfiguration und Plugin-Log prüfen."
hintSensorInfo="Die Standardabfrage liefert diese neun Werte. MAC-Adresse und RSSI (Empfangsstärke in dBm) erscheinen als Diagnose im Live-Log; RSSI ist kein Bodensensorwert und wird nicht als Messwert übertragen. Kein separater pH-, Luftfeuchte- oder Pflanzenname-Wert. Lichtstärke wird als Lux (lx), nicht als Lichtstrom in Lumen ausgegeben."

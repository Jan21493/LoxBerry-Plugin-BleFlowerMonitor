hintBluetooth="Bleak verwendet die standardisierte D-Bus-Schnittstelle von BlueZ. Interne Raspberry-Pi-Adapter und USB-Bluetooth-Adapter werden unterstützt. BlueZ muss laufen und der Adapter eingeschaltet sein."

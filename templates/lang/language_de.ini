hintLogs="Jede manuelle und geplante Abfrage erzeugt eine LoxBerry-Logsession in der Gruppe 'FlowerCare' mit dem angegebenen Level. Der Level 'Debug' enthält die meisten Details, die anderen Levels entsprechend weniger. Die Dateien liegen im Logverzeichnis des Plugins auf einer RAM-Disk und enden auf _xiaomi-miflora.log. Der LoxBerry verwaltet das Löschen alter Logs. Logs auf der RAM-Disk können nach einem Neustart fehlen."

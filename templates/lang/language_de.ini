heading="BLE Flower Monitor"
pluginIntro="Das BLE Flower Monitor Plugin fragt kompatible Pflanzensensoren wie den <b>Xiaomi Mi Flora</b> (auch bekannt als <b>HHCC Flower Care</b>, <b>VegTrug Flora Sensor</b> oder <b>Wanfei Pflanzenmonitor</b>) sowie verwandte Modelle wie den HHCC Flower Care Max und den HHCC Touch über Bluetooth Low Energy (BLE) ab. Alle diese Sensoren verwenden das gleiche Protokoll. Das Plugin ist eine eigenständige Neuentwicklung als Nachfolger des eingestellten <b>Xiaomi Mi Flora Flower Monitor Plugins</b> von Michael Miklis, aber Teile der Einstellungen und Anzeige sind übernommen worden. Die moderne BlueZ-D-Bus-Schnittstelle ermöglicht den Einsatz auf vielen Linux-Systemen; unterstützt werden integrierte Raspberry-Pi-Adapter und USB-Bluetooth-Dongles."
sectionGeneral="Allgemein und Abfrageintervall"
sectionBluetooth="Bluetooth / BlueZ D-Bus"
sectionMiniserver="Senden an Miniserver"
sectionMQTT="MQTT (empfohlen)"
sectionUDP="UDP (alternativ)"
sectionDiagnostics="Abfrage und Diagnose"
hintGeneral="Das aktivierte Plugin sucht im gewählten Stundenintervall nach kompatiblen Pflanzensensoren über Bluetooth Low Energy (BLE) und liest sie nacheinander aus."
hintLocaltime="Die intern vom Miniserver verwendete Zeit zählt ab 1.1.2009 00:00:00 Uhr in der lokalen Zeitzone des Miniservers. Der Schalter berücksichtigt die lokale Zeitzone des Loxberry im Loxone-Zeitstempel (Parameter <b>'PollTime'</b>). Alternativ wird UTC verwendet. <b>'PollTimeString'</b> gibt die Zeit im Klartext aus."
hintBluetooth="Einstellungen für den Bluetooth-Adapter zur Kommunikation mit den Sensoren. Das Plugin findet Sensoren bei einem BLE-Scan und liest Messwerte anschließend über GATT aus. Unter Linux greift die Python-Bibliothek Bleak über die BlueZ-D-Bus-Schnittstelle zu: BlueZ stellt den Bluetooth-Dienst bereit, D-Bus ermöglicht die Kommunikation zwischen Programmen. Benötigt wird ein BLE-fähiger Adapter (Bluetooth 4.0 oder neuer; BLE 5 ist nicht erforderlich), BlueZ ab Version 5.55 sowie ein eingeschalteter und nicht blockierter Adapter."
lblBTAdapter="Bluetooth-Adapter"
hintBTAdapter="Default verwendet immer hci0. USB und Onboard wählen bei jeder Abfrage den ersten passenden Adapter des ausgewählten Typs aus. Fehlt ein passender Adapter, wird ein Fehler ausgegeben; es erfolgt kein automatischer Wechsel auf einen anderen Typ."
lblDetectedAdapters="Installierte Bluetooth-Adapter"
adapterSerial="Onboard"
adapterUSB="USB"
adapterMissing="Kein passender Bluetooth-Adapter erkannt"
hintMQTT="Dies ist der empfohlene Übertragungsweg, weil kein Polling auf dem Miniserver erforderlich ist. Die Daten werden vom MQTT Gateway per API Aufruf (HTTP Web API) übertragen. Alle Einstellungen für MQTT werden aus <b>'MQTT Basics'</b> des Loxberrys übernommen."
hintMQTTTopic="Hinweise zum Format und benötigten virtuellen Eingängen findest Du unter <b>'Status und Abfragen'</b>. Das Format ist /<MQTT Prefix>/<MAC-Adresse>/<Parameter>, z.B. /flowermon/c47c8d66275b/temperature. Verwende <b>'miflora'</b> als Topic, wenn Du vom alten Plugin migrierst und bestehende MQTT-Topics beibehalten möchtest. Topic, MAC-Adresse und Sensorname werden kleingeschrieben. Keine Sonderzeichen (+ oder #) verwenden, da diese eine spezielle Bedeutung im MQTT-Protokoll haben."
hintUDP="Dies ist ein alternativer Übertragungsweg, der hauptsächlich für Migrationen von bestehenden Setups gedacht ist. Die Daten werden direkt an den Miniserver gesendet und müssen dort über UDP Inputs verarbeitet werden. Es ist NICHT sinnvoll, UDP neben MQTT zu verwenden. Miniserver und UDP-Port sind nur bei aktivierter UDP-Übertragung erforderlich. Das Format bleibt erhalten C47C8D66275B.Temperature=27.1"
hintDiagnostics="Über den Button <b>'Jetzt abfragen'</b> kannst Du eine Abfrage manuell starten, um Deine vorhandenen MiFlora-Sensoren zu ermitteln, inklusive deren MAC-Adressen und aktuellen Messwerten. Weiter unten siehst Du die benötigten virtuellen Eingänge, um Werte dieser Sensoren an den Miniserver zu übertragen und weiterzuverarbeiten. Diese erforderlichen Eingänge must Du dafür noch im Miniserver angelegen. Die Abfrage startet einmalig mit den gespeicherten Einstellungen. Der Fortschritt wird jede Sekunde aktualisiert. Details zur jeweiligen Abfrage findest Du in den Logs."

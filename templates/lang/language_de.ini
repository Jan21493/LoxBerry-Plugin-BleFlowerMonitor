hintUDP="Optional zusätzlich zu MQTT oder allein nutzbar. Miniserver und UDP-Port sind nur bei aktivierter UDP-Übertragung erforderlich. Das bisherige Format bleibt erhalten: C47C8D66275B.Temperature=27.1"

errInvalidInput="Ungültige Einstellungen. Bitte Eingaben und Auswahl prüfen."
errOutputRequired="Fehler: Du musst mindestens einen Übertragungsweg aktivieren - MQTT (empfohlen) oder UDP."
errMQTT="MQTT benötigt ein Topic ohne Platzhalter. Den Broker bitte unter LoxBerry im Menü <b>'MQTT Basics'</b> konfigurieren."
errPort="Der Port muss eine ganze Zahl zwischen 1 und 65535 sein."

hintLogs="Jede manuelle und geplante Abfrage erzeugt eine LoxBerry-Logsession in der Gruppe FlowerCare mit LOGSTART und LOGEND, Ergebnis und Laufzeit. Anzeige, Download und Log-Level-Auswahl erfolgen wie bei TeslaCmd über die Standard-Logfunktion von LoxBerry. Die Dateien liegen direkt im Plugin-Logverzeichnis und enden auf _xiaomi-miflora.log. LoxBerry verwaltet das Löschen alter Logs. Maximal 2 MiB Details pro Log; Logs auf der RAM-Disk können nach einem Neustart fehlen."

sectionLoxone="Virtuelle Eingänge in der Loxone Config"
hintLoxone="Die Beispiele verwenden das gespeicherte MQTT-Topic und die ausgewählte MAC-Adresse. Wähle einen der beim Scan gefundenen Sensoren oder gib über <b>'Editieren'</b> eine andere MAC-Adresse ein. Ohne gefundenen Sensor wird eine Beispieladresse angezeigt. Diese Auswahl zeigt nur die Einrichtungshilfe und verändert nicht die Übertragungseinstellungen."
transport="Übertragungsweg"
mqttRecommended="MQTT (empfohlen)"
sensorMac="MAC-Adresse des Sensors"
errMAC="Eine MAC-Adresse mit 12 Hex-Zeichen eingeben, wahlweise mit Doppelpunkten."
hintLoxoneMQTT="In LoxBerry <b><i>'MQTT Basics'</i></b> das <b><i>'MQTT Gateway'</i></b> öffnen, die unten angegebene Subscription hinzufügen und die gewünschten Topics dem Miniserver zuordnen. Bei HTTP-Übertragung im Gateway in Loxone Config virtuelle Eingänge mit den gezeigten Namen anlegen. <b>Wichtig:</b> Das Plugin sendet Topics vollständig kleingeschrieben; das Gateway ersetzt /, Leerzeichen und % im Eingangsnamen durch _. MQTT allein erzeugt keine Eingänge in der Loxone Config."
subscription="MQTT-Gateway Subscription"
hintGatewayUDP="Wenn das MQTT Gateway per UDP statt HTTP zum Miniserver sendet, gelten dessen UDP-Port und Befehlsformat. Die hier gezeigten virtuellen Eingangsnamen beziehen sich auf HTTP. Die UDP-Auswahl unten beschreibt die direkte UDP-Ausgabe dieses Plugins, nicht die des Gateways."
hintLoxoneUDP="UDP im Plugin aktivieren und speichern. In Loxone Config einen <b><i>'virtuellen UDP-Eingang'</i></b> mit dem konfigurierten Port anlegen, darunter je Messwert einen <b><i>'virtuellen UDP-Eingangsbefehl'</i></b>. Die gezeigte <b><i>'Befehlserkennung'</i></b> aus der Tabelleübernehmen. <b>Wichtig:</b> MAC-Adressen müssen ohne Doppelpunkte in Großbuchstaben, Parameter mit exakter Groß-/Kleinschreibung und <code>=\v</code> für den Zahlenwert angegeben werden."

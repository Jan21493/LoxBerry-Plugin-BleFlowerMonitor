INTRO="Instellingen: configureer en bewaar algemene instellingen en het uitleesinterval, de Bluetooth-adapter met een lijst van geïnstalleerde adapters en de overdracht naar de Miniserver via MQTT/UDP. Status en uitlezingen: Nu uitlezen start een scan met live voortgang en details van de geselecteerde adapter, inclusief alle gevonden sensoren. Hieronder vind je voorbeelden van virtuele Loxone-ingangen met instructies voor het gebruik en de configuratie van zowel MQTT als UDP. Logs: actuele communicatielogs voor MiFlora-sensoren met een instelbaar logniveau."

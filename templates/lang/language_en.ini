hintSensorInfo="The standard query returns these nine values. The MAC address and RSSI (received signal strength in dBm) appear as diagnostics in the live log; the distance in meters is only a rough free-space estimate, not a sensor measurement. RSSI is not published as a measurement. No separate pH, air humidity or plant name value. Light is reported as illuminance in lux (lx), not luminous flux in lumens."

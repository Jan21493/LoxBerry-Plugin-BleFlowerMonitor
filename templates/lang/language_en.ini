hintMQTT="Recommended transport. Broker, port, username, password and TLS settings are taken exclusively from LoxBerry MQTT Basics. Changes there apply on the next delivery. MQTT needs no configured Miniserver. Messages use QoS 1."
hintMQTTTopic="Format: miflora/c47c8d66275b/temperature. Topic, MAC and sensor name remain lowercase for compatibility. Do not use wildcards (+ or #)."
hintUDP="Use alongside MQTT or on its own. A Miniserver and UDP port are required only when UDP is enabled. The existing format is preserved: C47C8D66275B.Temperature=27.1"

hintMQTT="This is the recommended transport because no polling on the Miniserver is required. MQTT Gateway transfers the data via API calls (HTTP Web API). All MQTT settings are taken from LoxBerry's <b>'MQTT Basics'</b>."
hintMQTTTopic="See <b>'Status and queries'</b> for the format and required virtual inputs. The format is /<MQTT prefix>/<MAC address>/<parameter>, e.g. /flowermon/c47c8d66275b/temperature. Use <b>'miflora'</b> as the topic when migrating from the old plugin and keeping existing MQTT topics. Topic, MAC address and sensor name are lowercase. Do not use special characters (+ or #), as they have a specific meaning in the MQTT protocol."
hintUDP="This alternative transport is mainly intended for migrating existing setups. Data is sent directly to the Miniserver and must be processed there using UDP inputs. Using UDP alongside MQTT is NOT recommended. A Miniserver and UDP port are required only when UDP delivery is enabled. The format is preserved: C47C8D66275B.Temperature=27.1"
hintDiagnostics="Use <b>'Poll now'</b> to start a manual query to discover your MiFlora sensors, including their MAC addresses and current measurements. Below you can see the virtual inputs needed to transfer and process these sensors' values on the Miniserver. You still need to create these inputs on the Miniserver. The query runs once using the saved settings. Progress refreshes every second. See Logs for details of each query."

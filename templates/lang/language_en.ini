hintGatewayV2="<b>Important:</b> MQTT Gateway version 2 does not automatically subscribe to all topics. Select the specific topics you want to forward to your Miniserver. Here is a short guide for HTTP/API delivery:"
gatewayStep1="Open menu <b><i>'MQTT Gateway'</i></b>, tab <b><i>'Subscriptions'</i></b>. Expand folders if needed, check the desired topics individually and assign them to the Miniserver. In newer LoxBerry versions, you can alternatively scan the Miniserver for configured topics if they have already been created there. <b>Important:</b> Do not subscribe to a whole folder unless you really need all topics below it."
gatewayStep2="Open tab <b><i>'Traffic'</i></b>. Topics are displayed with the virtual input names and can be copied directly. You can also copy the matching virtual input names from the table below. Make sure to use the names exactly as shown!"
gatewayStep3="In Loxone Config create a <b><i>'virtual HTTP input'</i></b> as a folder for the subscribed topics. For its <b><i>'URL'</i></b>, enter a single dot (<code>.</code>) to prevent missing-parameter warnings."
gatewayStep4="Create a <b><i>'virtual HTTP input command'</i></b> for each numeric value and paste the matching input name into <b><i>'Name'</i></b>. <b>Important:</b> Use exact case. For <b><i>'command recognition'</i></b>, enter <code>\.</code> to satisfy the required-field check. <b>HTTP polling is NOT used!</b> MQTT Gateway sends values to the Miniserver via API calls. For text values use <b><i>'virtual text inputs'</i></b> instead."
gatewayStep5="Deploy the updated Loxone Config to your Miniserver."
gatewayChangedValues="<b>Note:</b> MQTT Gateway forwards only changed values. After creating inputs, either wait for a value change or press <b><i>'Resend all'</i></b> in menu <b><i>'MQTT Gateway'</i></b>, tab <b><i>'Traffic'</i></b>."

hintLoxoneMQTT="Open <b><i>'MQTT Gateway'</i></b> in LoxBerry <b><i>'MQTT Basics'</i></b>, add the subscription shown below and assign the desired topics to the Miniserver. For HTTP delivery from the gateway, create virtual inputs in Loxone Config with the names shown. <b>Important:</b> The plugin publishes fully lowercase topics; the gateway replaces /, spaces and % with _ in input names. MQTT alone does not create inputs in Loxone Config."
subscription="MQTT Gateway subscription:"
hintGatewayUDP="If MQTT Gateway sends to the Miniserver using UDP instead of HTTP, use its UDP port and command format. The virtual input names shown here refer to HTTP. The UDP choice below describes this plugin's direct UDP output, not the gateway's."
hintLoxoneUDP="Enable UDP in the plugin and save. In Loxone Config, create a <b><i>'virtual UDP input'</i></b> on the configured port and a <b><i>'virtual UDP input command'</i></b> for each value. Use the <b><i>'command recognition'</i></b> shown. <b>Important:</b> Uppercase MAC without colons, exact parameter case and <code>=\v</code> for numeric values."

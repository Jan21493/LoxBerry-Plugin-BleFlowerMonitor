sectionUDP="UDP (alternative)"
sectionDiagnostics="Polling and diagnostics"
hintGeneral="When enabled, the plugin searches for compatible plant sensors over Bluetooth Low Energy (BLE) at the selected hourly interval and reads them sequentially."
hintLocaltime="The Miniserver's internal time counts seconds from 2009-01-01 00:00:00 in its local time zone. This switch applies LoxBerry's local time zone to the Loxone timestamp (parameter <b>'PollTime'</b>). Otherwise UTC is used. <b>'PollTimeString'</b> provides the time in a readable format."
hintBluetooth="Bluetooth adapter settings for communication with the sensors. The plugin discovers sensors in a BLE scan and then reads measurements over GATT. On Linux, the Python library Bleak accesses Bluetooth through the BlueZ D-Bus interface: BlueZ provides the Bluetooth service, while D-Bus lets programs communicate with it. A BLE-capable adapter (Bluetooth 4.0 or later; BLE 5 is not required), BlueZ 5.55 or later, and a powered, unblocked adapter are required."
lblBTAdapter="Bluetooth adapter"
hintBTAdapter="Default always uses hci0. USB and Onboard select the first matching adapter of that type for every poll. If no matching adapter is available, an error is reported; the plugin does not automatically fall back to another type."
lblDetectedAdapters="Installed Bluetooth adapters"

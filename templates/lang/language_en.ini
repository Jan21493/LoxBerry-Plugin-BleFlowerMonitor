hintLogs="Each manual or scheduled query creates a LoxBerry log session in the <b>'FlowerCare'</b> group at the selected level. <b>'Debug'</b> contains the most detail; the other levels contain correspondingly less. Files are stored in the plugin's log directory on a RAM disk and end in _xiaomi-miflora.log. LoxBerry manages deletion of old logs. Logs on the RAM disk may be missing after a reboot."

heading="BLE Flower Monitor"
pluginIntro="The BLE Flower Monitor plugin queries compatible plant sensors such as the <b>Xiaomi Mi Flora</b> (also known as <b>HHCC Flower Care</b>, <b>VegTrug Flora Sensor</b> or <b>Wanfei plant monitor</b>) and related models such as the HHCC Flower Care Max and HHCC Touch over Bluetooth Low Energy (BLE). All these sensors use the same protocol. The plugin is an independently developed successor to Michael Miklis' discontinued <b>Xiaomi Mi Flora Flower Monitor plugin</b>, retaining parts of its settings and display. The modern BlueZ D-Bus interface enables use on many Linux systems; onboard Raspberry Pi adapters and USB Bluetooth dongles are supported."

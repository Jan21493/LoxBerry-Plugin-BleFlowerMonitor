hintLogs="Each manual or scheduled query creates a native LoxBerry log session in the FlowerCare group with LOGSTART and LOGEND, result and duration. Viewing, downloading and log-level selection use the standard LoxBerry log function, as in TeslaCmd. Files are stored directly in the plugin log directory and end in _xiaomi-miflora.log. LoxBerry manages deletion of old logs. At most 2 MiB of details per log; logs on the RAM disk may not survive a reboot."

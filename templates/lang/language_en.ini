hintTextInputs="<b>Text values:</b> For Name, Firmware and PollTimeString create a <b><i>'virtual text input'</i></b> with the matching name instead of a <b><i>'virtual HTTP input command'</i></b>. MQTT Gateway can also transfer these strings to the Miniserver via API calls."
hintUDPText="UDP command recognition =\v only applies to numbers, not the text values Name, Firmware and PollTimeString."
gatewayV2Active="MQTT Gateway version 2 is selected."
gatewayV2Recommended="MQTT Gateway version 2 is not selected, but is recommended for efficiency on LoxBerry 4."
hintGatewayV2="<b>Important:</b> There is no automatic subscription to all topics. Select the specific topics you want to forward to your Miniservers. Basic workflow for HTTP/API delivery:"
gatewayStep1="Open menu <b><i>'MQTT Gateway'</i></b>, tab <b><i>'Subscriptions'</i></b>. Expand folders if needed, check the specific topics you need and assign them to the Miniserver. <b>Important:</b> Do not subscribe to a whole folder unless you need all topics below it."
gatewayStep2="Open tab <b><i>'Traffic'</i></b> and copy the names of the subscribed topics or virtual inputs. The table below shows the matching input names for this plugin."
gatewayStep3="In Loxone Config create a <b><i>'virtual HTTP input'</i></b> as a folder for the subscribed topics. Enter a single dot (<code>.</code>) as its <b><i>'URL'</i></b> to prevent missing-parameter warnings."
gatewayStep4="Create a <b><i>'virtual HTTP input command'</i></b> for each numeric value and paste the matching input name into <b><i>'Name'</i></b>. <b>Important:</b> Use exact case. Enter <code>\.</code> in <b><i>'command recognition'</i></b> to satisfy the required-field check. <b>HTTP polling is NOT used!</b> MQTT Gateway sends values to the Miniserver via API calls. For text values use <b><i>'virtual text inputs'</i></b> instead."
gatewayStep5="Deploy the updated Loxone Config to your Miniserver."
gatewayChangedValues="<b>Note:</b> MQTT Gateway forwards only changed values. After creating inputs, either wait for a value change or press <b><i>'Resend all'</i></b> in menu <b><i>'MQTT Gateway'</i></b>, tab <b><i>'Traffic'</i></b>."
errLogList="Could not load LoxBerry's standard log view. Check LoxBerry Log Manager and the system log."
gatewayAvailable="MQTT configuration found; delivery uses LoxBerry MQTT Basics."
gatewayUnavailable="No MQTT broker configuration found. Check MQTT Basics and MQTT Gateway."
errGatewayConfig="Could not read the MQTT Gateway version from LoxBerry general.json. Check system configuration and the plugin log."
hintSensorInfo="The standard query returns these nine values. The MAC address and RSSI (received signal strength in dBm) appear as diagnostics in the live log; RSSI is not a soil sensor reading and is not published. No separate pH, air humidity or plant name value. Light uses lux (lx), not luminous flux in lumens; the wiki uses both terms inconsistently. Source:"
<style>
    .miflora-section { margin: 1.5em 0; }
    .miflora-section h2 { border-bottom: 1px solid #aaa; padding-bottom: .4em; }
    .miflora-hint { font-size: .9em; color: #555; margin: .3em 0 1em; }
    .miflora-message { padding: .8em; border: 1px solid #888; white-space: pre-line; }
    .miflora-error { padding: .8em; border: 1px solid #b00; color: #b00; }
    .miflora-toolbar { display: flex; align-items: center; gap: .7em; flex-wrap: wrap; }
    .miflora-table { width: 100%; border-collapse: collapse; }
    .miflora-table th, .miflora-table td { padding: .6em; border-bottom: 1px solid #ddd; text-align: left; vertical-align: top; }
    .miflora-table code { overflow-wrap: anywhere; }
    .miflora-table-wrap { overflow-x: auto; }
    .miflora-save { text-align: center; }
    .miflora-field { display: grid; grid-template-columns: minmax(12em, 25%) minmax(0, 1fr); align-items: center; gap: .5em 1em; margin: .8em 0; }
    .miflora-field > label { margin: 0 !important; }
    .miflora-field .ui-input-text, .miflora-field .ui-select { margin: 0; }
    .miflora-field .miflora-hint { margin-bottom: 0; }
    .miflora-subsection { margin: 1em 0 1em 1.5em; }
    @media (max-width: 700px) {
        .miflora-field { grid-template-columns: minmax(0, 1fr); }
        .miflora-subsection { margin-left: .5em; }
    }
    .miflora-dialog { width: min(52em, 95vw); max-height: 90vh; overflow: auto; padding: 1em 1.5em; border: 1px solid #888; border-radius: .4em; box-sizing: border-box; }
    .miflora-dialog::backdrop { background: rgba(0, 0, 0, .4); }
    .miflora-dialog-head { display: flex; align-items: center; justify-content: space-between; gap: 1em; }
    .miflora-dialog-head h2 { margin: 0; }
    .miflora-dialog-close { font-size: 1.6em; line-height: 1; background: none; border: 0; cursor: pointer; padding: 0 .2em; }
    .miflora-dialog input[type=text] { width: 100%; box-sizing: border-box; padding: .3em; }
    .miflora-dialog .miflora-table td { vertical-align: middle; }
    #txtLastData { font-family: monospace; height: 26em !important; max-height: 65vh; width: 100%; box-sizing: border-box; overflow: auto !important; white-space: pre; resize: vertical; }
</style>
<h1><TMPL_VAR NAME=heading ESCAPE=HTML></h1>
<TMPL_IF isSettings><p class="miflora-intro"><TMPL_VAR pluginIntro></p></TMPL_IF>
<TMPL_LOOP errors><p class="miflora-error" role="alert"><TMPL_VAR error></p></TMPL_LOOP>
<TMPL_IF message><p class="miflora-message" role="status"><TMPL_VAR NAME=message ESCAPE=HTML></p></TMPL_IF>
<TMPL_VAR frmStart>
<TMPL_IF isSettings>
<section class="miflora-section">
    <h2><TMPL_VAR NAME=sectionGeneral ESCAPE=HTML></h2>
    <p class="miflora-hint"><TMPL_VAR NAME=hintGeneral ESCAPE=HTML></p>
    <div class="miflora-field">
        <label for="chkPluginEnabled"><TMPL_VAR NAME=lblPluginEnabled ESCAPE=HTML></label>
        <div><TMPL_VAR chkPluginEnabled></div>
    </div>
    <div class="miflora-field">
        <label for="selPollFrequency"><TMPL_VAR NAME=lblPollFrequency ESCAPE=HTML></label>
        <div><TMPL_VAR selPollFrequency></div>
    </div>
    <div class="miflora-field">
        <label for="chkLocaltime"><TMPL_VAR NAME=lblLocaltime ESCAPE=HTML></label>
        <div><TMPL_VAR chkLocaltime>
            <p class="miflora-hint"><TMPL_VAR hintLocaltime></p>
        </div>
    </div>
</section>
<section class="miflora-section">
    <h2><TMPL_VAR NAME=sectionBluetooth ESCAPE=HTML></h2>
    <p class="miflora-hint"><TMPL_VAR NAME=hintBluetooth ESCAPE=HTML></p>
    <div class="miflora-field">
        <label for="selBTAdapter"><TMPL_VAR NAME=lblBTAdapter ESCAPE=HTML></label>
        <div><TMPL_VAR selBTAdapter>
            <p class="miflora-hint"><TMPL_VAR NAME=hintBTAdapter ESCAPE=HTML></p>
        </div>
    </div>
    <h3><TMPL_VAR NAME=lblDetectedAdapters ESCAPE=HTML></h3>
    <TMPL_IF adapters>
        <ul><TMPL_LOOP adapters><li><TMPL_VAR NAME=label ESCAPE=HTML></li></TMPL_LOOP></ul>
    <TMPL_ELSE>
        <p><TMPL_VAR NAME=adapterMissing ESCAPE=HTML></p>
    </TMPL_IF>
</section>
<section class="miflora-section">
    <h2><TMPL_VAR NAME=sectionMiniserver ESCAPE=HTML></h2>
    <section class="miflora-subsection">
    <h3><TMPL_VAR NAME=sectionMQTT ESCAPE=HTML></h3>
    <p class="miflora-hint"><TMPL_VAR hintMQTT></p>
    <div class="miflora-field">
        <label for="chkMQTTEnabled"><TMPL_VAR NAME=lblMQTTEnabled ESCAPE=HTML></label>
        <div><TMPL_VAR chkMQTTEnabled></div>
    </div>
    <div class="miflora-field">
        <label for="txtMQTTTopic"><TMPL_VAR NAME=lblMQTTTopic ESCAPE=HTML></label>
        <div><TMPL_VAR txtMQTTTopic>
            <p class="miflora-hint"><TMPL_VAR hintMQTTTopic></p>
        </div>
    </div>
    </section>
    <section class="miflora-subsection">
    <h3><TMPL_VAR NAME=sectionUDP ESCAPE=HTML></h3>
    <p class="miflora-hint"><TMPL_VAR NAME=hintUDP ESCAPE=HTML></p>
    <div class="miflora-field">
        <label for="chkUDPEnabled"><TMPL_VAR NAME=lblUDPEnabled ESCAPE=HTML></label>
        <div><TMPL_VAR chkUDPEnabled></div>
    </div>
    <div class="miflora-field">
        <label for="selMiniServer"><TMPL_VAR NAME=lblMiniServer ESCAPE=HTML></label>
        <div><TMPL_VAR selMiniServer></div>
    </div>
    <div class="miflora-field">
        <label for="txtMsUDPPort"><TMPL_VAR NAME=lblMsUDPPort ESCAPE=HTML></label>
        <div><TMPL_VAR txtMsUDPPort></div>
    </div>
    </section>
</section>
<div class="miflora-save"><TMPL_VAR btnSave></div>
</TMPL_IF>
<TMPL_IF isStatus>
<section class="miflora-section">
    <h2><TMPL_VAR NAME=sectionDiagnostics ESCAPE=HTML></h2>
    <p class="miflora-hint"><TMPL_VAR hintDiagnostics></p>
    <div class="miflora-toolbar">
        <TMPL_VAR btnPoll>
        <button type="button" id="clearOutput" data-inline="true"><TMPL_VAR NAME=btnClearOutput ESCAPE=HTML></button>
    </div>
    <label for="txtLastData"><TMPL_VAR NAME=lblLastData ESCAPE=HTML></label>
    <TMPL_VAR txtLastData>
    <div class="miflora-toolbar">
        <label for="dataAutoScroll"><input type="checkbox" id="dataAutoScroll" data-role="none" checked> <TMPL_VAR NAME=autoScroll ESCAPE=HTML></label>
        <a href="index.cgi?action=download-data" data-role="button" data-inline="true" data-ajax="false" download><TMPL_VAR NAME=download ESCAPE=HTML></a>
    </div>
    <p id="liveError" class="miflora-error" role="alert" hidden></p>
</section>
<section class="miflora-section" id="loxoneInputs" data-topic="<TMPL_VAR NAME=topicPrefix ESCAPE=HTML>">
    <h2><TMPL_VAR NAME=sectionLoxone ESCAPE=HTML></h2>
    <p class="miflora-hint"><TMPL_VAR hintLoxone></p>
    <div class="miflora-field">
        <label for="inputTransport"><TMPL_VAR NAME=transport ESCAPE=HTML></label>
        <div><select id="inputTransport" data-role="none">
            <option value="mqtt"<TMPL_IF transportMQTTSelected> selected</TMPL_IF>><TMPL_VAR NAME=mqttRecommended ESCAPE=HTML></option>
            <option value="udp"<TMPL_IF transportUDPSelected> selected</TMPL_IF>>UDP</option>
        </select></div>
    </div>
    <div class="miflora-field">
        <label for="sensorSelect"><TMPL_VAR NAME=sensorMac ESCAPE=HTML></label>
        <div><input id="sensorMac" type="text" data-role="none" aria-label="<TMPL_VAR NAME=sensorMac ESCAPE=HTML>" value="<TMPL_VAR NAME=selectedSensorMac ESCAPE=HTML>" maxlength="17" hidden>
            <select id="sensorSelect" data-role="none" aria-label="<TMPL_VAR NAME=sensorMac ESCAPE=HTML>">
                <TMPL_IF sensorAddresses>
                    <TMPL_LOOP sensorAddresses><option value="<TMPL_VAR NAME=address ESCAPE=HTML>"><TMPL_VAR NAME=address ESCAPE=HTML></option></TMPL_LOOP>
                <TMPL_ELSE>
                    <option value="5C:85:7E:B0:F3:AD" data-example="1">5C:85:7E:B0:F3:AD (<TMPL_VAR NAME=exampleMac ESCAPE=HTML>)</option>
                </TMPL_IF>
            </select>
            <button type="button" id="editMac" data-inline="true"><TMPL_VAR NAME=btnEditMac ESCAPE=HTML></button>
            <button type="button" id="exportTemplate" data-inline="true"><TMPL_VAR NAME=btnExportTemplate ESCAPE=HTML></button>
        </div>
    </div>
    <p id="macError" role="alert" class="miflora-error" hidden><TMPL_VAR NAME=errMAC ESCAPE=HTML></p>
    <div id="mqttHelp">
        <TMPL_IF gatewayDetected>
            <p class="miflora-gateway-status">
                <TMPL_IF mqttConfigured>
                    <span style="color:green"><b><TMPL_VAR gatewayFound></b></span>
                <TMPL_ELSE>
                    <span style="color:red"><b><TMPL_VAR gatewayFound></b></span>
                </TMPL_IF>
                <TMPL_IF showGatewayVersion>
                    <TMPL_IF gatewayV2>
                        <span style="color:green; font-weight:bold"><TMPL_VAR NAME=gatewayV2Active ESCAPE=HTML></span>
                    <TMPL_ELSE>
                        <span style="color:orange; font-weight:bold"><TMPL_VAR NAME=gatewayV2Recommended ESCAPE=HTML></span>
                    </TMPL_IF>
                </TMPL_IF>
            </p>
            <TMPL_IF gatewayV2>
                <p><TMPL_VAR hintGatewayV2></p>
                <h3><TMPL_VAR NAME=guideManualTitle ESCAPE=HTML></h3>
                <ol>
                    <li><TMPL_VAR gatewayStep1></li>
                    <li><TMPL_VAR gatewayStep2></li>
                    <li><TMPL_VAR gatewayStep3></li>
                    <li><TMPL_VAR gatewayStep4></li>
                    <li><TMPL_VAR gatewayStep5></li>
                </ol>
                <h3><TMPL_VAR NAME=guideTemplateTitle ESCAPE=HTML></h3>
                <ol>
                    <li><TMPL_VAR templateStep1></li>
                    <li><TMPL_VAR templateStep2></li>
                    <li><TMPL_VAR templateStep3></li>
                </ol>
                <p><TMPL_VAR gatewayChangedValues></p>
            <TMPL_ELSE>
                <p><TMPL_VAR hintLoxoneMQTT></p>
                <p><TMPL_VAR NAME=subscription ESCAPE=HTML> <code id="mqttSubscription"></code></p>
            </TMPL_IF>
        </TMPL_IF>
        <p class="miflora-hint"><TMPL_VAR hintTextInputs></p>
    </div>
    <div id="udpHelp" hidden>
        <p><TMPL_VAR hintLoxoneUDP></p>
        <p class="miflora-hint"><TMPL_VAR NAME=hintGatewayUDP ESCAPE=HTML></p>
        <p class="miflora-hint"><TMPL_VAR NAME=hintUDPText ESCAPE=HTML></p>
    </div>
    <div class="miflora-table-wrap">
    <table class="miflora-table">
        <thead><tr><th><TMPL_VAR NAME=parameter ESCAPE=HTML></th><th><TMPL_VAR NAME=description ESCAPE=HTML></th><th><TMPL_VAR NAME=unit ESCAPE=HTML></th><th><span id="inputColumn"><TMPL_VAR NAME=virtualInput ESCAPE=HTML></span></th><th class="topicColumn">MQTT Topic</th></tr></thead>
        <tbody>
            <tr data-key="Name"><td>Name</td><td><TMPL_VAR NAME=valueName ESCAPE=HTML></td><td><TMPL_VAR NAME=text ESCAPE=HTML></td><td><code class="inputExample"></code></td><td class="topicColumn"><code class="topicExample"></code></td></tr>
            <tr data-key="PollTime"><td>PollTime</td><td><TMPL_VAR NAME=valuePollTime ESCAPE=HTML></td><td>s</td><td><code class="inputExample"></code></td><td class="topicColumn"><code class="topicExample"></code></td></tr>
            <tr data-key="PollTimeString"><td>PollTimeString</td><td><TMPL_VAR NAME=valuePollTimeString ESCAPE=HTML></td><td><TMPL_VAR NAME=text ESCAPE=HTML></td><td><code class="inputExample"></code></td><td class="topicColumn"><code class="topicExample"></code></td></tr>
            <tr data-key="Firmware"><td>Firmware</td><td><TMPL_VAR NAME=valueFirmware ESCAPE=HTML></td><td><TMPL_VAR NAME=text ESCAPE=HTML></td><td><code class="inputExample"></code></td><td class="topicColumn"><code class="topicExample"></code></td></tr>
            <tr data-key="Temperature"><td>Temperature</td><td><TMPL_VAR NAME=valueTemperature ESCAPE=HTML></td><td>°C</td><td><code class="inputExample"></code></td><td class="topicColumn"><code class="topicExample"></code></td></tr>
            <tr data-key="Moisture"><td>Moisture</td><td><TMPL_VAR NAME=valueMoisture ESCAPE=HTML></td><td>%</td><td><code class="inputExample"></code></td><td class="topicColumn"><code class="topicExample"></code></td></tr>
            <tr data-key="Light"><td>Light</td><td><TMPL_VAR NAME=valueLight ESCAPE=HTML></td><td>lx</td><td><code class="inputExample"></code></td><td class="topicColumn"><code class="topicExample"></code></td></tr>
            <tr data-key="Conductivity"><td>Conductivity</td><td><TMPL_VAR NAME=valueConductivity ESCAPE=HTML></td><td>µS/cm</td><td><code class="inputExample"></code></td><td class="topicColumn"><code class="topicExample"></code></td></tr>
            <tr data-key="Battery"><td>Battery</td><td><TMPL_VAR NAME=valueBattery ESCAPE=HTML></td><td>%</td><td><code class="inputExample"></code></td><td class="topicColumn"><code class="topicExample"></code></td></tr>
        </tbody>
    </table>
    </div>
    <p class="miflora-hint"><TMPL_VAR NAME=hintSensorInfo ESCAPE=HTML></p>
</section>
</TMPL_IF>
<TMPL_IF isLogs>
<section class="miflora-section">
    <h2><TMPL_VAR NAME=tablogs ESCAPE=HTML></h2>
    <p class="miflora-hint"><TMPL_VAR hintLogs></p>
    <TMPL_VAR loglist>
</section>
</TMPL_IF>
<TMPL_VAR frmEnd>
<TMPL_IF isStatus>
<dialog id="templateDialog" class="miflora-dialog" aria-labelledby="templateDialogTitle">
    <div class="miflora-dialog-head">
        <h2 id="templateDialogTitle"><TMPL_VAR NAME=tplTitle ESCAPE=HTML></h2>
        <button type="button" class="miflora-dialog-close" data-role="none" data-close aria-label="<TMPL_VAR NAME=btnClose ESCAPE=HTML>">&times;</button>
    </div>
    <p class="miflora-hint"><TMPL_VAR NAME=tplHint ESCAPE=HTML></p>
    <p><b><TMPL_VAR NAME=tplMqttOnly ESCAPE=HTML></b></p>
    <div class="miflora-table-wrap">
    <table class="miflora-table">
        <thead><tr><th><TMPL_VAR NAME=sensorMac ESCAPE=HTML></th><th><TMPL_VAR NAME=tplSensorName ESCAPE=HTML></th></tr></thead>
        <tbody id="templateSensors"></tbody>
    </table>
    </div>
    <div class="miflora-table-wrap">
    <table class="miflora-table">
        <thead><tr><th><TMPL_VAR NAME=parameter ESCAPE=HTML></th><th><TMPL_VAR NAME=tplLabel ESCAPE=HTML></th><th><TMPL_VAR NAME=unit ESCAPE=HTML></th></tr></thead>
        <tbody id="templateParams"></tbody>
    </table>
    </div>
    <p id="templateError" class="miflora-error" role="alert" hidden></p>
    <p id="templateStored" class="miflora-message" role="status" hidden></p>
    <div class="miflora-toolbar">
        <button type="button" id="templateDownload" data-inline="true"><TMPL_VAR NAME=download ESCAPE=HTML></button>
        <button type="button" id="templateReset" data-inline="true"><TMPL_VAR NAME=btnReset ESCAPE=HTML></button>
        <button type="button" data-close data-inline="true"><TMPL_VAR NAME=btnClose ESCAPE=HTML></button>
    </div>
</dialog>
</TMPL_IF>
<div id="mifloraMessages" hidden data-polling="<TMPL_VAR NAME=txtPollingMessage ESCAPE=HTML>" data-error="<TMPL_VAR NAME=errRequest ESCAPE=HTML>" data-virtual="<TMPL_VAR NAME=virtualInput ESCAPE=HTML>" data-udp="<TMPL_VAR NAME=udpRecognition ESCAPE=HTML>" data-example="<TMPL_VAR NAME=exampleMac ESCAPE=HTML>" data-name-placeholder="<TMPL_VAR NAME=tplNamePlaceholder ESCAPE=HTML>" data-stored="<TMPL_VAR NAME=tplStored ESCAPE=HTML>"></div>
<script src="miflora.js?v=<TMPL_VAR NAME=jsVersion ESCAPE=URL>" defer></script>
<script>
    $('select[name=chkPluginEnabled], select[name=chkLocaltime], select[name=chkMQTTEnabled], select[name=chkUDPEnabled]')
        .attr('data-role', 'flipswitch');
    $('#txtMsUDPPort').attr({type: 'number', min: 1, max: 65535});
</script>
